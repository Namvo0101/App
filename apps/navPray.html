<title>Thắp Nhang Cầu Nguyện</title>
<style>

*{box-sizing:border-box}

input,select{border:1px solid #f2b84b88;background:#24120d;color:var(--fg);padding:9px 12px;border-radius:12px;font-size:15px;outline:none}
input{width:150px}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid #f2b84b88}
.seg button{background:#00000040;color:var(--fg);border:0;padding:9px 12px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ac);color:#3a1a0a;font-weight:700}
#pr{width:100%}
#vs{width:100%;font-size:12px;opacity:.85;text-align:center;line-height:1.35}
#go{background:linear-gradient(#ef7a4a,#c8382e);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0006}

[hidden]{display:none!important}

.person-card{width:100%;padding:9px;background:#0002;border:1px solid #f2b84b44;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:center}

.person-card .person-pr{grid-column:1/-1}

#queue-banner strong{color:#ffd56b}

const isMobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let sb=false,viV=null,speechToken=0,ttsAud=null,ttsTimer=null;
function pickVoice(){
 if(isMobile)return;
 try{const a=speechSynthesis.getVoices();viV=a.find(v=>/^vi([-_]|$)/i.test(v.lang))||a.find(v=>/vietnam|hoaimy|namminh|linh/i.test(v.name))||null}catch(e){viV=null}
}
if(!isMobile&&window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();setTimeout(pickVoice,400);setTimeout(pickVoice,1500)}
function setDuck(on){
 sb=on;
 if(!muted)music.volume=on?.08:.28;
}
function cancelSpeech(){
 speechToken++;
 clearTimeout(ttsTimer);
 setDuck(false);
 if(isMobile)return;
 try{speechSynthesis.cancel()}catch(e){}
 if(ttsAud){try{ttsAud.pause();ttsAud.onended=ttsAud.onerror=null;ttsAud.removeAttribute('src');ttsAud.load()}catch(e){}}
}
function splitChunks(t){
 return t.match(/[^.!?,;]+[.!?,;]?/g)?.map(s=>s.trim()).filter(Boolean)||[t];
}
function unlockSpeechFromGesture(){
 if(isMobile||muted)return;
 try{
  if(!ttsAud){
   ttsAud=new Audio();
   ttsAud.playsInline=true;
   ttsAud.referrerPolicy='no-referrer';
  }
  ttsAud.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  const p=ttsAud.play();
  if(p&&typeof p.then==='function')p.then(()=>{ttsAud.pause();ttsAud.currentTime=0}).catch(()=>{});
 }catch(e){}
 try{
  if(window.speechSynthesis){
   pickVoice();
   const warm=new SpeechSynthesisUtterance('');
   warm.volume=0;
   speechSynthesis.speak(warm);
  }
 }catch(e){}
}
function playOnlineTTS(text,token){
 const chunks=splitChunks(text);let idx=0;
 setDuck(true);
 const next=()=>{
  if(muted||token!==speechToken||idx>=chunks.length){if(token===speechToken)setDuck(false);return}
  const q=encodeURIComponent(chunks[idx++].slice(0,180));
  if(!ttsAud){ttsAud=new Audio();ttsAud.playsInline=true}
  ttsAud.referrerPolicy='no-referrer';
  ttsAud.src=`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=vi&q=${q}`;
  ttsAud.playbackRate=.95;
  ttsAud.onended=next;
  ttsAud.onerror=()=>{if(token===speechToken)setDuck(false)};
  const p=ttsAud.play();
  if(p&&typeof p.catch==='function')p.catch(()=>{if(token===speechToken)setDuck(false)});
 };
 next();
}
function speak(t){
 cancelSpeech();
 if(isMobile||muted||!t)return;
 const token=speechToken;
 pickVoice();
 if(viV){
  try{
   const u=new SpeechSynthesisUtterance(t);
   u.voice=viV;u.lang=viV.lang;u.rate=.88;u.pitch=1.05;
   let started=false;
   u.onstart=()=>{if(token===speechToken){started=true;setDuck(true)}};
   u.onend=()=>{if(token===speechToken)setDuck(false)};
   u.onerror=()=>{if(token===speechToken){if(!started)playOnlineTTS(t,token);else setDuck(false)}};
   setDuck(true);
   speechSynthesis.speak(u);
   ttsTimer=setTimeout(()=>{if(token===speechToken&&!started&&!speechSynthesis.speaking)playOnlineTTS(t,token)},750);
   return;
  }catch(e){}
 }
 playOnlineTTS(t,token);
}

const DUST_MAX=isMobile?1800:4200;
const dPos=new Float32Array(DUST_MAX*3),dCol=new Float32Array(DUST_MAX*3),dVel=new Float32Array(DUST_MAX*3);

const dAge=new Float32Array(DUST_MAX),dLife=new Float32Array(DUST_MAX),dBaseSize=new Float32Array(DUST_MAX),dBaseAlpha=new Float32Array(DUST_MAX),dPhase=new Float32Array(DUST_MAX);

const dustMat=new THREE.ShaderMaterial({
 uniforms:{uScale:{value:600}},
 vertexShader:'attribute float aSize;attribute float aAlpha;attribute vec3 aColor;varying float vA;varying vec3 vC;uniform float uScale;void main(){vA=aAlpha;vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=max(0.0,aSize*uScale/-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying float vA;varying vec3 vC;void main(){float r=length(gl_PointCoord-vec2(0.5));if(r>0.5)discard;float a=smoothstep(0.5,0.0,r);gl_FragColor=vec4(vC,a*vA);}',
 transparent:true,depthWrite:false,blending:THREE.AdditiveBlending

const dustPts=new THREE.Points(dustGeo,dustMat);

function spawnDust(x,y,z,r,g,b,size,life,vx,vy,vz,alpha){
 const i=dustCursor;dustCursor=(dustCursor+1)%DUST_MAX;
 if(dLife[i]<=0)dustActive++;
 const k=i*3;
 dPos[k]=x;dPos[k+1]=y;dPos[k+2]=z;
 dCol[k]=r;dCol[k+1]=g;dCol[k+2]=b;
 dVel[k]=vx;dVel[k+1]=vy;dVel[k+2]=vz;
 dBaseSize[i]=size;dBaseAlpha[i]=alpha;dSize[i]=size;dAlpha[i]=0;
 dAge[i]=0;dLife[i]=life;dPhase[i]=Math.random()*6.283;
}
function updateDust(dt,tt){
 dustMat.uniforms.uScale.value=R.domElement.height/(2*Math.tan(cam.fov*Math.PI/360));
 if(!dustActive)return;
 for(let i=0;i<DUST_MAX;i++){
  const L=dLife[i];if(L<=0)continue;
  const age=dAge[i]+dt;
  if(age>=L){dLife[i]=0;dAlpha[i]=0;dSize[i]=0;dustActive--;continue}
  dAge[i]=age;
  const k=i*3,u=age/L,ph=dPhase[i],damp=1-.7*dt;
  dVel[k]*=damp;dVel[k+2]*=damp;
  dVel[k+1]+=.16*dt;
  dPos[k]+=(dVel[k]+Math.sin(ph+tt*1.6+age*2.3)*.13)*dt;
  dPos[k+1]+=dVel[k+1]*dt;
  dPos[k+2]+=(dVel[k+2]+Math.cos(ph*1.3+tt*1.2+age*1.9)*.08)*dt;
  dAlpha[i]=dBaseAlpha[i]*Math.min(1,age/.12)*Math.pow(1-u,1.4);
  dSize[i]=dBaseSize[i]*(1-.35*u);
 }
 dustGeo.attributes.position.needsUpdate=true;
 dustGeo.attributes.aColor.needsUpdate=true;
 dustGeo.attributes.aSize.needsUpdate=true;

/* Chuẩn bị tan: quét canvas của sprite thành các ô; mỗi ô sẽ bị xóa khỏi texture và nhả ra bụi theo thời gian */
function beginDissolve(item){
 const spr=item.sprite,tex=spr.material.map,cv=tex&&tex.image;
 if(!cv||!cv.getContext){item.dis={cells:[],idx:0};return}
 const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,cell=w>800?10:6;
 let data;
 try{data=ctx.getImageData(0,0,w,h).data}catch(e){item.dis={cells:[],idx:0};return}
 const cols=Math.ceil(w/cell),rows=Math.ceil(h/cell),cells=[];
 const pText=isMobile?.5:.85,pBg=isMobile?.07:.16;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x0=c*cell,y0=r*cell,x1=Math.min(w,x0+cell),y1=Math.min(h,y0+cell);
  let best=-1,bi=0,maxA=0;
  for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){
   const i=(y*w+x)*4,a=data[i+3];
   if(a<10)continue;
   if(a>maxA)maxA=a;
   const sc=a+(data[i]+data[i+1]+data[i+2])/3;
   if(sc>best){best=sc;bi=i}
  }
  if(maxA<10)continue;
  const pr=data[bi],pg=data[bi+1],pb=data[bi+2],isText=(pr+pg+pb)/3>185&&maxA>140;
  const spawn=maxA>=70&&Math.random()<(isText?pText:pBg);
  cells.push({
   x:x0,y:y0,spawn,t:.58*Math.random()+.42*(c/cols),
   r:isText?pr/255:(pr/255+1)/2,g:isText?pg/255:(pg/255+.78)/2,b:isText?pb/255:(pb/255+.35)/2
  });
 }
 cells.sort((p,q)=>p.t-q.t);
 ctx.shadowColor='rgba(0,0,0,0)';ctx.shadowBlur=0;
 ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';
 item.dis={cells,idx:0,ctx,tex,w,h,cell,dirty:false,lastUp:0,pSize:Math.max(.032,spr.scale.x*cell/w*1.5)};

function stepDissolve(item,d){
 const D=item.dis;if(!D||!D.cells.length)return;
 const spr=item.sprite,sx=spr.scale.x,sy=spr.scale.y;
 if(D.idx<D.cells.length&&D.cells[D.idx].t<=d){
  camR.setFromMatrixColumn(cam.matrixWorld,0);camU.setFromMatrixColumn(cam.matrixWorld,1);
  const{ctx,cell,w,h}=D;
  while(D.idx<D.cells.length&&D.cells[D.idx].t<=d){
   const c=D.cells[D.idx++];
   ctx.fillRect(c.x-1,c.y-1,cell+2,cell+2);
   if(c.spawn){
    const u=(c.x+Math.random()*cell)/w-.5,v=(c.y+Math.random()*cell)/h-.5;
    const ox=u*sx,oy=-v*sy;
    spawnDust(
     spr.position.x+camR.x*ox+camU.x*oy,
     spr.position.y+camR.y*ox+camU.y*oy,
     spr.position.z+camR.z*ox+camU.z*oy+(Math.random()-.5)*.04,
     c.r,c.g,c.b,
     D.pSize*(.7+Math.random()*.8),1.5+Math.random()*1.5,
     (Math.random()-.5)*.35,.18+Math.random()*.4,(Math.random()-.5)*.2,
     .55+Math.random()*.35
    );
   }
  }
  D.dirty=true;
 }
 if(D.dirty){
  const now=performance.now();
  if(now-D.lastUp>45||d>=1){D.tex.needsUpdate=true;D.dirty=false;D.lastUp=now}
 }
}

function wrapTextByPixelWidth(ctx,text,maxWidth){
 const words=String(text||'').trim().split(/\s+/).filter(Boolean);
 if(!words.length)return[''];
 const lines=[];
 let currentLine=words[0];
 for(let i=1;i<words.length;i++){
  const word=words[i];
  const testLine=currentLine+' '+word;
  if(ctx.measureText(testLine).width<=maxWidth){
   currentLine=testLine;
  }else{
   lines.push(currentLine);
   currentLine=word;
  }
 }
 if(currentLine)lines.push(currentLine);
 return lines;
}

function createSkyPrayerSprite(item){

 const fontSize=len<=75?36:len<=165?31:27;
 const lineHeight=Math.round(fontSize*1.36);
 const canvasW=len<=75?820:len<=165?880:940;
 const padX=48,padY=34;
 const maxTextW=canvasW-padX*2;

 const measureCanvas=document.createElement('canvas');
 const mCtx=measureCanvas.getContext('2d');
 mCtx.font=`600 ${fontSize}px system-ui,-apple-system,"Segoe UI",sans-serif`;
 const lines=wrapTextByPixelWidth(mCtx,fullText,maxTextW);

 const contentH=lines.length*lineHeight;
 const cardH=Math.max(136,contentH+padY*2);

 const c=document.createElement('canvas');
 c.width=canvasW;c.height=canvasH;
 const ctx=c.getContext('2d');

 const cardX=16,cardY=16,cardW=canvasW-32;
 const bgGrad=ctx.createLinearGradient(0,cardY,0,cardY+cardH);
 bgGrad.addColorStop(0,'rgba(142, 62, 20, 0.88)');

 ctx.fillStyle=bgGrad;

 ctx.lineWidth=3.5;
 ctx.beginPath();
 if(ctx.roundRect)ctx.roundRect(cardX,cardY,cardW,cardH,26);
 else ctx.rect(cardX,cardY,cardW,cardH);
 ctx.fill();ctx.stroke();

 ctx.strokeStyle='rgba(255, 236, 160, 0.32)';
 ctx.lineWidth=1.5;
 ctx.beginPath();
 if(ctx.roundRect)ctx.roundRect(cardX+10,cardY+10,cardW-20,cardH-20,18);
 else ctx.rect(cardX+10,cardY+10,cardW-20,cardH-20);
 ctx.stroke();

 ctx.shadowColor='rgba(255, 195, 55, 0.95)';
 ctx.shadowBlur=14;
 ctx.fillStyle='#fffdf0';
 ctx.font=`600 ${fontSize}px system-ui,-apple-system,"Segoe UI",sans-serif`;
 ctx.textAlign='center';
 ctx.textBaseline='middle';

 const startY=cardY+cardH/2-((lines.length-1)*lineHeight)/2;
 lines.forEach((line,idx)=>{
  ctx.fillText(line,canvasW/2,startY+idx*lineHeight,maxTextW+8);
 });

 const tex=new THREE.CanvasTexture(c);

 const sprite=new THREE.Sprite(mat);
 const baseW=canvasW/255;
 const baseH=canvasH/255;
 sprite.scale.set(baseW,baseH,1);
 sprite.userData={baseW,baseH,lineCount:lines.length};
 sprite.renderOrder=8;
 return sprite;
}

   a.reactDelayMax=0.20+slot*0.13+Math.random()*0.15;

// Đồng bộ trạng thái của toàn bộ các đoàn qua HTTP REST chuẩn (đảm bảo 100% hoạt động giống nhánh /prayers)
let isFetchingSessions=false;
async function pollAllLiveSessions(){
 if(!FIREBASE_DB_URL||isFetchingSessions)return;
 isFetchingSessions=true;
 try{
  const res=await fetch(`${FIREBASE_DB_URL}/live_sessions.json?cb=${Date.now()}`,{cache:'no-store'});
  if(!res.ok){
   if(res.status===401||res.status===403){
    const el=$('live-count');
    if(el)el.textContent='⚠️ Cần mở quyền Rules cho /live_sessions';
   }
   return;
  }
  const allData=await res.json();
  const activeKeys=new Set();
  if(allData&&typeof allData==='object'){
   Object.entries(allData).forEach(([sid,sData])=>{
    if(sid&&sData&&typeof sData==='object'){
     activeKeys.add(sid);
     if(sid!==MY_SESSION_ID){
      handleRemoteSessionSnapshot(sid,sData);
     }
    }
   });
  }
  // Xóa những đoàn đã rời khỏi chánh điện trên server
  for(const existingSid of [...remoteSessions.keys()]){
   if(!activeKeys.has(existingSid)){
    removeRemoteSession(existingSid);
   }
  }
  // Kiểm tra các phiên bị treo bằng đồng hồ nội bộ của chính máy này (không phụ thuộc đồng hồ máy khác)
  const localNow=performance.now();
  remoteSessions.forEach((sess,sid)=>{
   if(localNow-sess.localSeenAt>LOCAL_STALE_TIMEOUT_MS){
    fetch(`${FIREBASE_DB_URL}/live_sessions/${encodeURIComponent(sid)}.json`,{method:'DELETE'}).catch(()=>{});
    removeRemoteSession(sid);
   }
  });
  evaluateAltarQueue();
  updateLiveCounterUI();
 }catch(e){
  // Bỏ qua lỗi mạng tạm thời
 }finally{
  isFetchingSessions=false;
 }
}

function initMultiplayerFirebase(){
 // 1. Khởi chạy ngay bộ đồng bộ REST (dùng chung đường truyền với /prayers nên luôn nhận diện được mọi đoàn)

 try{
  if(window.firebase){
   if(!firebase.apps.length){
    firebase.initializeApp({databaseURL:FIREBASE_DB_URL,projectId:'thapnhang-default-rtdb'});
   }
   fbDb=firebase.database();
   sessionsRef=fbDb.ref('live_sessions');
   sessionsRef.on('child_added',snap=>handleRemoteSessionSnapshot(snap.key,snap.val()));
   sessionsRef.on('child_changed',snap=>handleRemoteSessionSnapshot(snap.key,snap.val()));
   sessionsRef.on('child_removed',snap=>removeRemoteSession(snap.key));
  }
 }catch(e){
  console.warn('Sử dụng chế độ REST đồng bộ trực tiếp:',e);
 }

 // 3. Nhịp tim (Heartbeat) mỗi 6 giây tăng chỉ số seq để các máy khác biết phiên vẫn đang sống (bất kể lệch giờ hệ thống)

   myHeartbeatSeq++;

 },6000);

 updateLiveCounterUI();
}

// Quản lý việc tạo, cập nhật và xóa các đoàn người chơi khác (Remote Sessions)
function handleRemoteSessionSnapshot(sid,data){
 if(!sid||sid===MY_SESSION_ID||!data||typeof data!=='object')return;
 // Firebase có thể trả về mảng hoặc object cho members
 const rawMembers=Array.isArray(data.members)?data.members:(data.members&&typeof data.members==='object'?Object.values(data.members):[]);
 if(!rawMembers.length)return;
 data.members=rawMembers;

 const nowPerf=performance.now();
 const incomingSeq=Number(data.seq)||0;
 const incomingPosKey=`${data.pos?.x||0}_${data.pos?.z||0}_${data.state||''}_${data.activeSpeakerIdx??-1}_${data.offerIdx??0}`;

 let sess=remoteSessions.get(sid);
 if(!sess){
  if(remoteSessions.size>=MAX_VISIBLE_REMOTE_SESSIONS&&data.state==='roaming')return;
  const builtActors=rawMembers.map((m,idx)=>{
   const a=build({name:m.name||`Khách ${idx+1}`,gender:m.gender||'m'},false,true);
   a.laneX=(idx-(rawMembers.length-1)/2)*1.45;
   const startX=(Number(data.pos?.x)||0)+a.laneX;
   const startZ=data.pos?.z!==undefined?Number(data.pos.z):15.5;
   a.root.position.set(startX,0,startZ);
   a.faceAngle=data.pos?.rot!==undefined?Number(data.pos.rot):Math.PI;
   a.root.rotation.y=a.faceAngle;
   return a;
  });
  assignFollowersOffsets(builtActors,Number(data.leaderIdx)||0);
  sess={
   id:sid,
   data,
   actors:builtActors,
   leaderIdx:Number(data.leaderIdx)||0,
   walkWeight:0,
   walkPhase:Math.random()*6.28,
   lastSpokenIdx:-1,
   stateTimer:0,
   lastState:data.state||'queuing',
   localSeenAt:nowPerf,
   lastSeq:incomingSeq,
   lastPosKey:incomingPosKey
  };
  remoteSessions.set(sid,sess);
 }else{
  // Chỉ làm mới bộ đếm thời gian sống nội bộ khi thấy seq hoặc trạng thái/vị trí của đoàn đó có cập nhật
  if(incomingSeq!==sess.lastSeq||incomingPosKey!==sess.lastPosKey){
   sess.localSeenAt=nowPerf;
   sess.lastSeq=incomingSeq;
   sess.lastPosKey=incomingPosKey;
  }
  const prevState=sess.data.state;
  sess.data=data;
  if(prevState!==data.state){
   sess.stateTimer=0;
   sess.lastState=data.state;
  }
  const newLead=Math.max(0,Math.min(sess.actors.length-1,Number(data.leaderIdx)||0));
  if(newLead!==sess.leaderIdx){
   sess.leaderIdx=newLead;
   assignFollowersOffsets(sess.actors,newLead);
  }
 }

 // Nếu đoàn của người khác đang ở bước đọc lời cầu nguyện, hiển thị chữ bay trên đầu nhân vật đó
 if(data.state==='praying'){

  const spk=Number(data.activeSpeakerIdx);
  if(spk>=0&&spk<sess.actors.length&&spk!==sess.lastSpokenIdx){

  }
 }else{
  sess.lastSpokenIdx=-1;
  if(data.state==='roaming'){
   bowlI.g.visible=true;
  }
 }

 evaluateAltarQueue();
 updateLiveCounterUI();
}

const RITUAL_STATES=new Set(['queuing','approaching','offering','praying']);

function getRitualQueueSorted(){
 const list=[];
 if(mySessionActive&&phase!=='panoramic'&&phase!=='idle'){
  list.push({
   id:MY_SESSION_ID,
   joinedAt:myJoinedAt||Date.now(),
   state:phase==='queue'?'queuing':phase==='approach'?'approaching':phase==='offer'?'offering':'praying',
   leaderName:people[0]?.name||'Bạn',
   memberCount:people.length
  });
 }
 remoteSessions.forEach((sess,sid)=>{
  const st=sess.data?.state;
  if(RITUAL_STATES.has(st)){
   list.push({
    id:sid,
    joinedAt:Number(sess.data?.joinedAt)||0,
    state:st,
    leaderName:sess.data?.members?.[0]?.name||'Khách hành hương',
    memberCount:sess.data?.members?.length||1
   });
  }
 });
 list.sort((a,b)=>(a.joinedAt-b.joinedAt)||a.id.localeCompare(b.id));
 return list;
}

function evaluateAltarQueue(){

 myQueueRank=myIdx;

 if(phase==='queue'){

   // Cập nhật vị trí đứng chờ trên thảm đỏ theo thứ tự hàng đợi
   const targetQueueZ=Math.min(18.0,1.6+Math.max(1,myIdx)*2.7);

// --- THUẬT TOÁN TÌM VỊ TRÍ THẢ NGẪU NHIÊN KHÔNG ĐÈ LÊN NHAU SAU KHI HÀNH LỄ ---
const PILLAR_Z=[12,8,4,0,-4,-8];
const PINE_TREES=[[-10,16],[10,17],[-12,25],[12,26],[-9,32],[9,33]];
function clampAndCollidePosition(x,z,prevX=x,prevZ=z){
 let nx=x,nz=Math.max(-8.0,Math.min(40.5,z));
 if(nz<12.5){
  if(Math.abs(prevX)>6.35&&prevZ>=12.2){
   nz=Math.max(12.5,nz);
   nx=Math.max(-18.5,Math.min(18.5,nx));
  }else{
   nx=Math.max(-6.3,Math.min(6.3,nx));
  }
 }else{
  nx=Math.max(-18.5,Math.min(18.5,nx));
 }
 if(nz<-6.8&&Math.abs(nx)<3.4){
  nz=-6.8;
 }
 if(nx>-2.75&&nx<2.75&&nz>-5.55&&nz<-3.55){
  const dFront=Math.abs(nz - (-3.55));
  const dBack=Math.abs(nz - (-5.55));
  const dLeft=Math.abs(nx - (-2.75));
  const dRight=Math.abs(nx - 2.75);
  const minD=Math.min(dFront,dBack,dLeft,dRight);
  if(minD===dFront)nz=-3.55;
  else if(minD===dBack)nz=-5.55;
  else if(minD===dLeft)nx=-2.75;
  else nx=2.75;
 }
 for(const pz of PILLAR_Z){
  for(const px of [-5,5]){
   const dx=nx-px,dz=nz-pz,dist=Math.hypot(dx,dz),minR=0.72;
   if(dist<minR&&dist>0.0001){
    nx=px+(dx/dist)*minR;
    nz=pz+(dz/dist)*minR;
   }
  }
 }
 for(const lx of [-3,3]){
  const dx=nx-lx,dz=nz-14,dist=Math.hypot(dx,dz),minR=0.75;
  if(dist<minR&&dist>0.0001){
   nx=lx+(dx/dist)*minR;
   nz=14+(dz/dist)*minR;
  }
 }
 for(const [tx,tz] of PINE_TREES){
  const dx=nx-tx,dz=nz-tz,dist=Math.hypot(dx,dz),minR=0.85;
  if(dist<minR&&dist>0.0001){
   nx=tx+(dx/dist)*minR;
   nz=tz+(dz/dist)*minR;
  }
 }
 return[nx,nz];
}

function findNonOverlappingRoamSpot(){
 // Thu thập tất cả vị trí của những người chơi khác đang có mặt trong chánh điện
 const occupied=[];
 remoteSessions.forEach(sess=>{
  if(sess.data?.pos){
   occupied.push([Number(sess.data.pos.x)||0,Number(sess.data.pos.z)||0]);
  }
  sess.actors.forEach(a=>occupied.push([a.root.position.x,a.root.position.z]));
 });

 // Thử lấy mẫu 30 vị trí ngẫu nhiên trong hai cánh chánh điện (tránh lối đi thảm đỏ ở giữa để nhường chỗ cho đoàn đang xếp hàng) hoặc sân chùa
 for(let attempt=0;attempt<30;attempt++){
  let rx,rz;
  if(attempt<22){
   // Trong lòng chánh điện hai bên tả/hữu (|x| từ 2.0 đến 4.2, z từ -1.2 đến 10.2)
   const side=Math.random()<.5?-1:1;
   rx=side*(2.0+Math.random()*2.2);
   rz=-1.2+Math.random()*11.4;
  }else{
   // Ngoài sân chánh điện thoáng rộng
   rx=(Math.random()-.5)*11.0;
   if(Math.abs(rx)<2.0)rx=rx<0?-2.4:2.4;
   rz=13.0+Math.random()*7.5;
  }
  const [cx,cz]=clampAndCollidePosition(rx,rz,rx,rz);
  const minClearance=attempt<18?2.4:1.6;
  const conflict=occupied.some(([ox,oz])=>Math.hypot(cx-ox,cz-oz)<minClearance);
  if(!conflict)return[cx,cz];
 }
 // Fallback nếu cực kỳ đông người
 const fallbackSide=Math.random()<.5?-1:1;
 return clampAndCollidePosition(fallbackSide*(2.3+Math.random()*1.8),2.5+Math.random()*6.5);
}

function mkGroupSeq(){

 s.push({d:1.2,p:HANDS,on:()=>launchPrayer(actors[0],people[0],0,false)});
 s.push({d:firstDur,wait:1,p:HANDS});

 }

   });
  }},

 );
 return s;
}
function startStep(){
 const s=seq[si];from={...P};st=0;wf=[ch.root.position.x,ch.root.position.z];
 if(s.walk)s.dur=Math.max(0.2,Math.hypot(s.walk[0]-wf[0],s.walk[1]-wf[1])/s.speed);
 else if(s.walkGroupZ!==undefined){
  s.dur=Math.max(0.2,Math.abs(s.walkGroupZ-ch.root.position.z)/s.speed);
  groupWalkFrom=actors.map(a=>[a.root.position.x,a.root.position.z]);
 }else if(s.walkGroupSpot){
  const [tx,tz]=s.walkGroupSpot;
  s.dur=Math.max(0.3,Math.hypot(tx-ch.root.position.x,tz-ch.root.position.z)/s.speed);
  groupWalkFrom=actors.map(a=>[a.root.position.x,a.root.position.z]);
  s.groupTargets=actors.map((a,i)=>{
   const jitterX=(i===0?0:(i%2===0?1:-1)*0.95)+(Math.random()-.5)*0.25;
   const jitterZ=(i===0?0:0.85*Math.ceil(i/2))+(Math.random()-.5)*0.25;
   return clampAndCollidePosition(tx+jitterX,tz+jitterZ,tx,tz);
  });
 }
 else s.dur=s.d;
 if(s.face!==undefined){face=s.face;actors.forEach(a=>{if(phase==='group'||phase==='approach'||a===ch)a.faceAngle=face})}
 if(s.cm){cm=s.cm;orb.a*=.4;orb.p*=.4}
 say(s.msg);if(s.on)s.on();
}

let lastUserCamInput=0,pointerDownPos={x:0,y:0},pointerMoved=false;
R.domElement.addEventListener('pointerdown',e=>{
 if(!e.isPrimary)return;
 orb.drag=true;orb.x=e.clientX;orb.y=e.clientY;
 pointerDownPos.x=e.clientX;pointerDownPos.y=e.clientY;pointerMoved=false;
 lastUserCamInput=performance.now();
 R.domElement.setPointerCapture(e.pointerId);
});
R.domElement.addEventListener('pointermove',e=>{
 if(!orb.drag)return;
 if(Math.hypot(e.clientX-pointerDownPos.x,e.clientY-pointerDownPos.y)>6)pointerMoved=true;
 const dx=(e.clientX-orb.x)*.006,dy=(e.clientY-orb.y)*.005;
 if(cm==='panoramic')orb.a-=dx;
 else orb.a=Math.max(-1.4,Math.min(1.4,orb.a-dx));
 orb.p=Math.max(-.6,Math.min(1.8,orb.p+dy));
 orb.x=e.clientX;orb.y=e.clientY;
 lastUserCamInput=performance.now();
});
const stopDrag=e=>{
 if(orb.drag&&!pointerMoved&&phase==='panoramic'&&actors.length>1&&e&&e.clientX!==undefined){
  // Chỉ raycast vào mảng actors của chính mình để đổi Leader của mình
  const rect=R.domElement.getBoundingClientRect();
  pointerNDC.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointerNDC.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointerNDC,cam);
  const roots=actors.map(a=>a.root);
  const hits=raycaster.intersectObjects(roots,true);
  if(hits.length){
   let obj=hits[0].object;
   while(obj&&!roots.includes(obj))obj=obj.parent;
   const idx=roots.indexOf(obj);
   if(idx!==-1&&idx!==leaderIndex){
    setLeader(idx);
    lastUserCamInput=performance.now();
   }
  }
 }
 orb.drag=false;
};
R.domElement.addEventListener('pointerup',stopDrag);R.domElement.addEventListener('pointercancel',stopDrag);R.domElement.addEventListener('lostpointercapture',()=>orb.drag=false);

 }

 if(e.key==='ArrowLeft')orb.a=cm==='panoramic'?orb.a-step:Math.max(-1.4,orb.a-step);
 else if(e.key==='ArrowRight')orb.a=cm==='panoramic'?orb.a+step:Math.min(1.4,orb.a+step);

 e.preventDefault();

{

  const dist=Math.hypot(dx,dy);
  if(dist>maxRad){dx=(dx/dist)*maxRad;dy=(dy/dist)*maxRad}
  joyKnob.style.transform=`translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0)`;
  joyState.dx=dx/maxRad;

 };
 joyZone.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  joyState.active=true;joyState.id=e.pointerId;
  joyZone.classList.add('active');
  joyZone.setPointerCapture(e.pointerId);
  updateJoy(e);
 });
 joyZone.addEventListener('pointermove',e=>{
  if(!joyState.active||e.pointerId!==joyState.id)return;

/* ---------- Nội suy chuyển động & Hoạt cảnh cho các Đoàn Người Chơi Khác (Remote Sessions) ---------- */
const POSE_HOLD=pz({arm:-1.25,armZ:.52});
const POSE_KNEEL=pz({hipY:.24,leg:1.35,arm:-1.15,armZ:.52});
const POSE_BOW=pz({hipY:.24,leg:1.35,torso:1.18,arm:-2.05,armZ:.15,eye:1});
const POSE_HANDS=pz({arm:-1.12,armZ:.52,torso:.16,head:.42,eye:1});

function updateRemoteSessions(dt,allActorsForSeparation){
 const queue=getRitualQueueSorted();
 remoteSessions.forEach((sess,sid)=>{
  sess.stateTimer+=dt;
  const st=sess.data?.state||'queuing';
  const leadIdx=Math.max(0,Math.min(sess.actors.length-1,sess.leaderIdx||0));
  const leader=sess.actors[leadIdx]||sess.actors[0];
  if(!leader)return;

  if(st==='queuing'){
   // Đứng xếp hàng trên thảm đỏ theo thứ tự trong hàng đợi
   const qIdx=Math.max(1,queue.findIndex(item=>item.id===sid));
   const targetZ=Math.min(18.0,1.6+qIdx*2.7);
   sess.actors.forEach(a=>{
    const tx=a.laneX,tz=targetZ;
    const dx=tx-a.root.position.x,dz=tz-a.root.position.z,dist=Math.hypot(dx,dz);
    if(dist>0.06){
     const step=Math.min(dist,1.55*dt);
     a.root.position.x+=(dx/dist)*step;
     a.root.position.z+=(dz/dist)*step;
     a.faceAngle=Math.atan2(dx,dz);
     a.walkWeight+=(1-a.walkWeight)*Math.min(1,dt*7);
    }else{
     a.faceAngle=Math.PI;
     a.walkWeight+=(0-a.walkWeight)*Math.min(1,dt*7);
    }
    a.walkPhase+=dt*6.2*a.walkWeight;
    a.held.g.visible=true;
    a.tipMaterial.emissiveIntensity=0;
    animateActor(a,POSE_HOLD,dt,a.walkWeight,false,a.faceAngle,a.walkPhase);
   });
  }else if(st==='approaching'||st==='offering'){
   // Tiến vào trước bàn thờ và cắm nhang
   const targetZ=st==='approaching'?-3.7:-2.5;
   sess.actors.forEach((a,idx)=>{
    const isOfferingNow=(st==='offering'&&idx===Number(sess.data?.offerIdx||0));
    const tx=isOfferingNow?0:a.laneX;
    const tz=isOfferingNow?-3.7:targetZ;
    const dx=tx-a.root.position.x,dz=tz-a.root.position.z,dist=Math.hypot(dx,dz);
    if(dist>0.06){
     const step=Math.min(dist,1.4*dt);
     a.root.position.x+=(dx/dist)*step;
     a.root.position.z+=(dz/dist)*step;
     a.faceAngle=Math.atan2(dx,dz);
     a.walkWeight+=(1-a.walkWeight)*Math.min(1,dt*7);
    }else{
     a.faceAngle=Math.PI;
     a.walkWeight+=(0-a.walkWeight)*Math.min(1,dt*7);
    }
    a.walkPhase+=dt*6.2*a.walkWeight;
    a.held.g.visible=(st==='approaching')||(idx>=Number(sess.data?.offerIdx||0));
    a.tipMaterial.emissiveIntensity=a.held.g.visible?1.8:0;
    const targetPose=(st==='offering'&&dist<=0.1&&!isOfferingNow)?POSE_KNEEL:POSE_HOLD;
    animateActor(a,targetPose,dt,a.walkWeight,false,a.faceAngle,a.walkPhase);
   });
  }else if(st==='praying'){
   // Quỳ lạy 3 nhịp và chắp tay khấn
   const spkIdx=Number(sess.data?.activeSpeakerIdx??-1);
   const bowCycle=sess.stateTimer%2.9;
   const targetPose=spkIdx>=0?POSE_HANDS:(bowCycle<1.6?POSE_BOW:POSE_KNEEL);
   sess.actors.forEach((a,idx)=>{
    a.held.g.visible=false;
    a.root.position.x+=(a.laneX-a.root.position.x)*Math.min(1,dt*5);
    a.root.position.z+=(-2.5-a.root.position.z)*Math.min(1,dt*5);
    a.faceAngle=Math.PI;
    a.walkWeight=0;
    // Nội suy mượt giữa các tư thế quỳ/lạy/khấn
    for(const k in a.P)a.P[k]+=(targetPose[k]-a.P[k])*Math.min(1,dt*6);
    animateActor(a,a.P,dt,0,idx===spkIdx,Math.PI,0);
   });
  }else{
   // Chế độ đi dạo tự do (roaming): Nội suy mượt vị trí Leader & các thành viên đi theo
   const targetX=Number(sess.data?.pos?.x)||0;
   const targetZ=Number(sess.data?.pos?.z)||3.2;
   const targetRot=Number(sess.data?.pos?.rot)||0;

   const dx=targetX-leader.root.position.x;
   const dz=targetZ-leader.root.position.z;
   const dist=Math.hypot(dx,dz);
   const speed=2.5;

   if(dist>0.05){
    const step=Math.min(dist,speed*dt*Math.min(1.8,1+dist*0.25));
    leader.root.position.x+=(dx/dist)*step;
    leader.root.position.z+=(dz/dist)*step;
    leader.faceAngle=Math.atan2(dx,dz);
    leader.walkWeight+=(Math.min(1,dist*1.4)-leader.walkWeight)*Math.min(1,dt*8);
   }else{
    leader.faceAngle=targetRot;
    leader.walkWeight+=(0-leader.walkWeight)*Math.min(1,dt*8);
   }
   leader.walkPhase+=dt*6.8*leader.walkWeight;
   leader.held.g.visible=false;
   for(const k in leader.P)leader.P[k]+=(ID[k]-leader.P[k])*Math.min(1,dt*7);
   animateActor(leader,leader.P,dt,leader.walkWeight,false,leader.faceAngle,leader.walkPhase);

   // Các thành viên đi theo Leader của đoàn người chơi khác
   const lSin=Math.sin(leader.faceAngle),lCos=Math.cos(leader.faceAngle);
   for(let i=0;i<sess.actors.length;i++){
    if(i===leadIdx)continue;
    const follower=sess.actors[i];
    follower.held.g.visible=false;
    for(const k in follower.P)follower.P[k]+=(ID[k]-follower.P[k])*Math.min(1,dt*7);

    const sideOff=follower.gatherSideOffset||((i%2?1:-1)*1.35);
    const backOff=follower.gatherBackOffset||1.45;
    let ftx=leader.root.position.x - lSin*backOff + lCos*sideOff;
    let ftz=leader.root.position.z - lCos*backOff - lSin*sideOff;

    for(const other of allActorsForSeparation){
     if(other===follower)continue;
     const ox=follower.root.position.x-other.root.position.x;
     const oz=follower.root.position.z-other.root.position.z;
     const od=Math.hypot(ox,oz);
     if(od<1.25&&od>0.001){
      const push=(1.25-od)*0.75;
      ftx+=(ox/od)*push;
      ftz+=(oz/od)*push;
     }
    }

    const fdx=ftx-follower.root.position.x;
    const fdz=ftz-follower.root.position.z;
    const fDist=Math.hypot(fdx,fdz);
    if(fDist>0.32){
     const fStep=Math.min(fDist-0.1,speed*(follower.speedFactor||1)*dt);
     const [nx,nz]=clampAndCollidePosition(follower.root.position.x+(fdx/fDist)*fStep,follower.root.position.z+(fdz/fDist)*fStep,follower.root.position.x,follower.root.position.z);
     follower.root.position.set(nx,0,nz);
     follower.faceAngle=Math.atan2(fdx,fdz);
     follower.walkWeight+=(Math.min(1,fDist*0.85+0.2)-follower.walkWeight)*Math.min(1,dt*6);
    }else{
     follower.walkWeight+=(0-follower.walkWeight)*Math.min(1,dt*7);
    }
    follower.walkPhase+=dt*6.8*follower.walkWeight;
    animateActor(follower,follower.P,dt,follower.walkWeight,false,follower.faceAngle,follower.walkPhase);
   }
  }
 });
}

function animateActor(actor,pose,dt,walkWeight,isPraying=false,targetFace=face,stepPhase=wph){
 const r=actor.root,d=Math.atan2(Math.sin(targetFace-r.rotation.y),Math.cos(targetFace-r.rotation.y));r.rotation.y+=d*Math.min(1,dt*6);
 const sw=pose.arm>-.6?walkWeight:0,sn=Math.sin(stepPhase);
 const nod=isPraying?Math.sin(tt*4.8)*.13:0;
 const bowPulse=isPraying?Math.sin(tt*4.8)*.035:0;
 actor.hip.position.y=pose.hipY+Math.abs(sn)*.035*walkWeight;
 actor.legL.rotation.x=pose.leg+sn*.45*walkWeight;actor.legR.rotation.x=pose.leg-sn*.45*walkWeight;
 actor.armL.rotation.set(pose.arm-sn*.38*sw-bowPulse*.6,0,-pose.armZ);actor.armR.rotation.set(pose.arm+sn*.38*sw-bowPulse*.6,0,pose.armZ);
 actor.torso.rotation.x=pose.torso+bowPulse;actor.torso.scale.y=1+Math.sin(tt*2.2)*.012;
 actor.head.rotation.x=pose.head+nod;actor.head.rotation.z=Math.sin(tt*1.6)*(isPraying?.02:.05);
 if(actor.sprout){
  actor.sprout.rotation.z=Math.sin(tt*3.4+actor.blinkOffset)*.12+sn*.16*walkWeight;
  actor.sprout.rotation.x=-nod*.75+Math.cos(tt*2.6)*.06;
 }
 if(actor.leaderRing&&actor.leaderRing.visible){
  const pulse=1+Math.sin(tt*4)*.08;
  actor.leaderRing.scale.set(pulse,pulse,1);
 }
 const eyesClosed=pose.eye>.55;
 const blinkCycle=(tt+actor.blinkOffset)%3.6;
 const blinkScale=blinkCycle<.12?Math.max(.12,Math.abs(blinkCycle-.06)/.06):1;
 actor.openEyes.forEach(e=>{e.visible=!eyesClosed;e.scale.y=blinkScale});
 actor.closedEyes.forEach(e=>{e.visible=eyesClosed});
 actor.blushList.forEach(m=>{m.emissiveIntensity=eyesClosed||isPraying?.42:.15});
 const isLead=!actor.isRemote&&phase==='panoramic'&&actors[leaderIndex]===actor;
 if(actor.labelHighlight!==isPraying||actor.labelLeader!==isLead)updateLabel(actor.name,actor,isPraying,isLead);
 actor.held.g.position.set(0,pose.incY,pose.incZ);
 if(!actor.isRemote){
  const lit=running&&((phase==='approach'&&si>=1)||(phase==='offer'&&actor===ch&&si<=1))&&actor.held.g.visible;
  actor.tipMaterial.emissiveIntensity=lit?Math.min(2,actor.tipMaterial.emissiveIntensity+dt*1.5):0;
 }
}

   d=Math.min(1,(fp.age-disStart)/fp.dissolveDur);
   stepDissolve(fp,d);
  }
  const fadeIn=Math.min(1,fp.age/.7),tail=d>.9?Math.max(0,1-(d-.9)/.1):1;
  fp.sprite.position.y+=fp.vy*dt*(1+d*.9);
  fp.sprite.position.x+=Math.sin(fp.phase+tt*1.1)*fp.drift*dt;
  const grow=1+(fp.age/fp.life)*.1;
  fp.sprite.scale.set(2.35*grow,.39*grow,1);
  fp.sprite.material.opacity=fadeIn*tail*.96;
 }

 // 6. Thẻ lời chúc cộng đồng: đóng băng + ẩn khi có người khấn, hết đời thì tan thành bụi
 const focusOn=isPrayerFocusActive();
 if(!focusOn&&communityPrayersPool.length>0&&((running&&ch&&ch.root.position.z<12)||activeSkyPrayers.length>0||!running)){
  skySpawnAccumulator+=dt;
  if(skySpawnAccumulator>0.55){
   skySpawnAccumulator=0;
   spawnRandomSkyPrayer();
  }
 }
 for(let i=activeSkyPrayers.length-1;i>=0;i--){
  const it=activeSkyPrayers[i];
  it.vis=Math.max(0,Math.min(1,it.vis+(focusOn?-dt/.55:dt/.9)));
  if(!focusOn)it.age+=dt;
  if(it.age>=it.life){
   scene.remove(it.sprite);
   it.sprite.material.map.dispose();
   it.sprite.material.dispose();
   activeSkyPrayers.splice(i,1);
   continue;
  }
  const disStart=it.life-it.dissolveDur;
  let d=0;
  if(it.age>=disStart){
   if(!it.dis)beginDissolve(it);
   d=Math.min(1,(it.age-disStart)/it.dissolveDur);
   stepDissolve(it,d);
  }
  if(!focusOn){
   if(it.sprite.position.y<6.2)it.sprite.position.y+=it.vy*(1+d*1.6)*dt;
   it.sprite.position.x+=Math.sin(it.phase+tt*1.1)*it.driftX*(1+d)*dt;
  }
  const grow=1+d*.1,fadeIn=Math.min(1,it.age/.7),tail=d>.9?Math.max(0,1-(d-.9)/.1):1;
  it.sprite.scale.set(it.baseW*grow,it.baseH*grow,1);
  it.sprite.material.opacity=fadeIn*tail*it.vis*.95;
  it.sprite.visible=it.vis>.01;
 }
 updateDust(dt,tt);

 luckyClover.position.y=2.62+Math.sin(tt*1.6)*.07;
 luckyClover.rotation.y=.36+Math.sin(tt*.85)*.22;
 luckyClover.rotation.x=.08+Math.cos(tt*1.1)*.05;
 luckyClover.rotation.z=Math.sin(tt*.95)*.06;
 cloverAura.intensity=.55+Math.sin(tt*2.2)*.15;
 flames.forEach(([f,l,gl],i)=>{const q=1+Math.sin(tt*14+i*3)*.15+Math.random()*.08;f.scale.set(q,2.9*q,q);l.intensity=.8+Math.sin(tt*11+i)*.15;if(gl){const gq=1.25+Math.sin(tt*9+i*2)*.12+Math.random()*.05;gl.scale.set(gq,gq,1);gl.material.opacity=.5+Math.sin(tt*13+i)*.08}});
 pl.forEach((l,i)=>l.intensity=1.15+Math.sin(tt*3+i)*.08);
 dust.position.y=Math.sin(tt*.7)*.12;dust.rotation.y=tt*.02;

 // 7. Điều khiển Camera độc lập cho riêng phiên của mình (bám theo nhân vật `ch` của mình)
 const r=ch.root;
 if(cm==='idle'){lk.set(0,1.4,15.5);cp.set(lk.x+Math.sin(.55+orb.a)*4.6,2.4+orb.p,lk.z+Math.cos(.55+orb.a)*4.6)}
 else if(cm==='follow'){lk.set(0,1.6,r.position.z-1.5);const dist=Math.max(5.5,Math.min(7.5,r.position.z+7.5));cp.set(lk.x+Math.sin(.38+orb.a)*dist,2.9+orb.p,lk.z+Math.cos(.38+orb.a)*dist)}
 else if(cm==='panoramic'){
  if(!orb.drag&&!joyState.active&&(performance.now()-lastUserCamInput>1200)){
   orb.a+=dt*0.168;
  }
  lk.set(r.position.x,1.55,r.position.z-0.3);
  const panoRadius=6.0;
  cp.set(lk.x+Math.sin(orb.a)*panoRadius,2.75+orb.p,lk.z+Math.cos(orb.a)*panoRadius);
 }
 else{lk.set(r.position.x*.5,1.3,r.position.z);cp.set(lk.x+Math.sin(.9+orb.a)*5.5,2.8+orb.p,lk.z+Math.cos(.9+orb.a)*5.5)}
 cam.position.lerp(cp,1-Math.exp(-dt*2.5));lkc.lerp(lk,1-Math.exp(-dt*4));cam.lookAt(lkc);
 R.render(scene,cam);
}
loop();
} catch(error) {
 console.error('Không thể khởi tạo cảnh 3D:',error);
 $('error').hidden=false;
}
