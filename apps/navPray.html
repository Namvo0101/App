const isMobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let sb=false,viV=null,speechToken=0,ttsAud=null,ttsTimer=null;
function pickVoice(){
 if(isMobile)return;
 try{const a=speechSynthesis.getVoices();viV=a.find(v=>/^vi([-_]|$)/i.test(v.lang))||a.find(v=>/vietnam|hoaimy|namminh|linh/i.test(v.name))||null}catch(e){viV=null}
}

function setDuck(on){

}
function cancelSpeech(){

 try{speechSynthesis.cancel()}catch(e){}
 if(ttsAud){try{ttsAud.pause();ttsAud.onended=ttsAud.onerror=null;ttsAud.removeAttribute('src');ttsAud.load()}catch(e){}}
}
function splitChunks(t){

}
function unlockSpeechFromGesture(){
 if(isMobile||muted)return;
 try{
  if(!ttsAud){
   ttsAud=new Audio();
   ttsAud.playsInline=true;
   ttsAud.referrerPolicy='no-referrer';
  }
  // Mở khóa Audio element trong lúc người dùng vừa click nút Thắp nhang
  ttsAud.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  const p=ttsAud.play();
  if(p&&typeof p.then==='function')p.then(()=>{ttsAud.pause();ttsAud.currentTime=0}).catch(()=>{});
 }catch(e){}
 try{
  if(window.speechSynthesis){
   pickVoice();
   const warm=new SpeechSynthesisUtterance('');
   warm.volume=0;
   speechSynthesis.speak(warm);
  }

}
function playOnlineTTS(text,token){
 const chunks=splitChunks(text);let idx=0;
 setDuck(true);
 const next=()=>{
  if(muted||token!==speechToken||idx>=chunks.length){if(token===speechToken)setDuck(false);return}
  const q=encodeURIComponent(chunks[idx++].slice(0,180));
  if(!ttsAud){ttsAud=new Audio();ttsAud.playsInline=true}
  ttsAud.referrerPolicy='no-referrer';
  ttsAud.src=`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=vi&q=${q}`;
  ttsAud.playbackRate=.95;
  ttsAud.onended=next;
  ttsAud.onerror=()=>{if(token===speechToken)setDuck(false)};
  const p=ttsAud.play();
  if(p&&typeof p.catch==='function')p.catch(()=>{if(token===speechToken)setDuck(false)});
 };
 next();
}
function speak(t){
 cancelSpeech();
 if(isMobile||muted||!t)return;
 const token=speechToken;
 pickVoice();
 if(viV){
  try{
   const u=new SpeechSynthesisUtterance(t);
   u.voice=viV;u.lang=viV.lang;u.rate=.88;u.pitch=1.05;
   let started=false;
   u.onstart=()=>{if(token===speechToken){started=true;setDuck(true)}};
   u.onend=()=>{if(token===speechToken)setDuck(false)};
   u.onerror=()=>{if(token===speechToken){if(!started)playOnlineTTS(t,token);else setDuck(false)}};
   setDuck(true);
   speechSynthesis.speak(u);
   ttsTimer=setTimeout(()=>{if(token===speechToken&&!started&&!speechSynthesis.speaking)playOnlineTTS(t,token)},750);
   return;
  }catch(e){}
 }
 playOnlineTTS(t,token);
}

function dissolveSprite(sp,pts,cw,ch,kinds){

  st.vel[i*3]=.16+Math.random()*.3;st.vel[i*3+1]=.32+Math.random()*.6;st.vel[i*3+2]=(Math.random()-.5)*.2;

function updateEmbers(dt,tt){
 for(let k=emberSystems.length-1;k>=0;k--){
  const s=emberSystems[k],P=s.pos,C=s.col;s.age+=dt;let alive=false;
  for(let i=0;i<s.n;i++){
   const t=s.age-s.delay[i];let b=0;
   if(t<0){alive=true;b=Math.min(1,s.age/.4)*(.8+.2*Math.sin(tt*9+s.ph[i]))}
   else{
    const q=t/s.life[i];
    if(q<1){
     alive=true;
     P[i*3]+=(s.vel[i*3]+Math.sin(tt*1.8+s.ph[i])*.12)*dt;P[i*3+1]+=s.vel[i*3+1]*dt*(1+q);P[i*3+2]+=s.vel[i*3+2]*dt;
     b=Math.pow(1-q,1.3)*(.75+.25*Math.sin(tt*14+s.ph[i]));
    }
   }
   C[i*3]=s.base[i*3]*b;C[i*3+1]=s.base[i*3+1]*b;C[i*3+2]=s.base[i*3+2]*b;
  }
  s.obj.geometry.attributes.position.needsUpdate=true;s.obj.geometry.attributes.color.needsUpdate=true;
  if(!alive){scene.remove(s.obj);s.obj.geometry.dispose();s.obj.material.dispose();emberSystems.splice(k,1)}
 }
}

    .filter(([,item])=>item&&typeof item==='object'&&String(item.text||'').trim())
    .map(([id,item])=>({id,text:String(item.text).trim()}));
   // Lọc chống trùng lặp nội dung chữ (chỉ giữ lại 1 bản cho mỗi nội dung lời chúc)
   const seenTexts=new Set();
   const uniqueList=[];
   for(let i=rawEntries.length-1;i>=0;i--){
    const entry=rawEntries[i];
    const norm=normalizePrayerText(entry.text);
    if(norm&&!seenTexts.has(norm)){
     seenTexts.add(norm);
     uniqueList.push(entry);
    }
   }
   for(let i=uniqueList.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [uniqueList[i],uniqueList[j]]=[uniqueList[j],uniqueList[i]];
   }
   communityPrayersPool=uniqueList;
   skyPoolCursor=0;
  }else{
   communityPrayersPool=[];
  }
 }catch(e){
  console.warn('Không tải được lời chúc cộng đồng:',e);
  communityPrayersPool=[];
 }
}

// Hàm ngắt dòng chính xác theo chiều rộng pixel thực tế trên Canvas (đảm bảo không mất bất kỳ từ nào tới 300 ký tự)
function wrapTextByPixelWidth(ctx,text,maxWidth){
 const words=String(text||'').trim().split(/\s+/).filter(Boolean);
 if(!words.length)return[''];
 const lines=[];
 let currentLine=words[0];
 for(let i=1;i<words.length;i++){
  const word=words[i];
  const testLine=currentLine+' '+word;
  if(ctx.measureText(testLine).width<=maxWidth){
   currentLine=testLine;
  }else{
   lines.push(currentLine);
   currentLine=word;
  }
 }
 if(currentLine)lines.push(currentLine);
 return lines;
}

// Tạo thẻ lời chúc 3D tự động co giãn chiều cao theo độ dài văn bản (hiển thị trọn vẹn 100% lời chúc tới 300 ký tự)
function createSkyPrayerSprite(item){
 const fullText=`“${String(item.text||'').trim()}”`;
 const len=fullText.length;
 // Tự động chọn cỡ chữ & độ rộng khung tối ưu theo độ dài lời chúc
 const fontSize=len<=75?36:len<=165?31:27;
 const lineHeight=Math.round(fontSize*1.36);
 const canvasW=len<=75?820:len<=165?880:940;
 const padX=48,padY=34;
 const maxTextW=canvasW-padX*2;

 const measureCanvas=document.createElement('canvas');
 const mCtx=measureCanvas.getContext('2d');
 mCtx.font=`600 ${fontSize}px system-ui,-apple-system,"Segoe UI",sans-serif`;
 const lines=wrapTextByPixelWidth(mCtx,fullText,maxTextW);

 const contentH=lines.length*lineHeight;
 const cardH=Math.max(136,contentH+padY*2);
 const canvasH=cardH+32;

 const c=document.createElement('canvas');
 c.width=canvasW;c.height=canvasH;
 const ctx=c.getContext('2d');

 const cardX=16,cardY=16,cardW=canvasW-32;
 // Nền thẻ lụa vàng hổ phách ấm sáng chuyển sắc
 const bgGrad=ctx.createLinearGradient(0,cardY,0,cardY+cardH);
 bgGrad.addColorStop(0,'rgba(142, 62, 20, 0.88)');
 bgGrad.addColorStop(0.5,'rgba(108, 42, 14, 0.86)');
 bgGrad.addColorStop(1,'rgba(78, 28, 9, 0.88)');
 ctx.fillStyle=bgGrad;
 ctx.strokeStyle='rgba(255, 222, 118, 0.95)';
 ctx.lineWidth=3.5;
 ctx.beginPath();
 if(ctx.roundRect)ctx.roundRect(cardX,cardY,cardW,cardH,26);
 else ctx.rect(cardX,cardY,cardW,cardH);
 ctx.fill();ctx.stroke();

 // Viền chỉ vàng mảnh bên trong tạo vẻ trang trọng như thẻ ước nguyện
 ctx.strokeStyle='rgba(255, 236, 160, 0.32)';
 ctx.lineWidth=1.5;
 ctx.beginPath();
 if(ctx.roundRect)ctx.roundRect(cardX+10,cardY+10,cardW-20,cardH-20,18);
 else ctx.rect(cardX+10,cardY+10,cardW-20,cardH-20);
 ctx.stroke();

 // Vẽ đầy đủ tất cả các dòng của lời chúc
 ctx.shadowColor='rgba(255, 195, 55, 0.95)';
 ctx.shadowBlur=14;
 ctx.fillStyle='#fffdf0';
 ctx.font=`600 ${fontSize}px system-ui,-apple-system,"Segoe UI",sans-serif`;
 ctx.textAlign='center';
 ctx.textBaseline='middle';

 const startY=cardY+cardH/2-((lines.length-1)*lineHeight)/2;
 lines.forEach((line,idx)=>{
  ctx.fillText(line,canvasW/2,startY+idx*lineHeight,maxTextW+8);
 });

 const tex=new THREE.CanvasTexture(c);
 const sk=sampleCardPoints(ctx,canvasW,canvasH);
 const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:0});
 const sprite=new THREE.Sprite(mat);
 // Giữ đúng tỷ lệ khung hình thực tế trong không gian 3D để chữ luôn sắc nét, không bị bẹp
 const baseW=canvasW/255;
 const baseH=canvasH/255;
 sprite.scale.set(baseW,baseH,1);
 sprite.userData={baseW,baseH,lineCount:lines.length,pts:sk.pts,kinds:sk.kinds,cw:canvasW,ch:canvasH};
 sprite.renderOrder=8;
 return sprite;
}

function spawnRandomSkyPrayer(){
 // Số lượng thẻ bay tối đa không bao giờ vượt quá số lời chúc thực tế trong Database (và tối đa 16 thẻ cùng lúc)
 const maxConcurrent=Math.min(16,communityPrayersPool.length);
 if(!maxConcurrent||activeSkyPrayers.length>=maxConcurrent)return;

 // Tìm một lời chúc chưa hiển thị trên bầu trời (kiểm tra cả ID lẫn nội dung chữ để chống trùng tuyệt đối)
 const activeIds=new Set(activeSkyPrayers.map(p=>p.id));
 const activeTexts=new Set(activeSkyPrayers.map(p=>normalizePrayerText(p.text)));
 let pickedItem=null;
 for(let i=0;i<communityPrayersPool.length;i++){
  const candidate=communityPrayersPool[(skyPoolCursor+i)%communityPrayersPool.length];
  const normCandidate=normalizePrayerText(candidate.text);
  if(!activeIds.has(candidate.id)&&!activeTexts.has(normCandidate)){
   pickedItem=candidate;
   skyPoolCursor=(skyPoolCursor+i+1)%communityPrayersPool.length;
   break;
  }
 }
 if(!pickedItem)return;

 let x=0,y=0,z=0,found=false;
 for(let attempt=0;attempt<10;attempt++){
  // Bay khắp bề ngang chánh điện (-5.8m đến 5.8m) và chiều sâu từ bàn thờ (-9.2m) đến cửa chánh điện (11.5m)
  const tx=(Math.random()-.5)*11.6;
  const tz=-9.2+Math.random()*20.7;
  // Độ cao từ ngang bụng nhân vật (0.7m) tới sát trần chánh điện (5.6m); nếu ở ngay trên bàn thờ thì từ 2.0m trở lên
  const minY=(tz<-3.6&&Math.abs(tx)<3.4)?2.0:0.7;
  const ty=minY+Math.random()*(5.6-minY);
  const tooClose=activeSkyPrayers.some(p=>Math.hypot(p.sprite.position.x-tx,p.sprite.position.y-ty,p.sprite.position.z-tz)<2.2);
  if(!tooClose){x=tx;y=ty;z=tz;found=true;break}
 }
 if(!found)return;
 const sprite=createSkyPrayerSprite(pickedItem);
 sprite.position.set(x,y,z);
 scene.add(sprite);
 
 // Giải thuật 7 bậc giới hạn số ký tự để tính toán thời gian vòng đời (life) tối ưu
 const rawTextLength=String(pickedItem.text||'').trim().length;
 let dynamicLife=5.0;
 if(rawTextLength<=40)dynamicLife=5.0;
 else if(rawTextLength<=80)dynamicLife=6.5;
 else if(rawTextLength<=130)dynamicLife=8.0;
 else if(rawTextLength<=180)dynamicLife=9.5;
 else if(rawTextLength<=230)dynamicLife=11.0;
 else if(rawTextLength<=280)dynamicLife=12.5;
 else dynamicLife=14.0;

 activeSkyPrayers.push({
  id:pickedItem.id,
  text:pickedItem.text,
  sprite,
  baseW:sprite.userData.baseW||3.25,
  baseH:sprite.userData.baseH||0.79,
  age:0,
  life:dynamicLife,
  vy:0.07+Math.random()*0.04,
  driftX:(Math.random()-.5)*0.14,
  phase:Math.random()*Math.PI*2
 });
}

 while(activeSkyPrayers.length){

 }

// Giới hạn vùng di chuyển & xử lý va chạm (tường chánh điện, sân rộng ngoài trời, hàng cột đỏ, cây thông, đèn đá, bàn thờ)
const PILLAR_Z=[12,8,4,0,-4,-8];
const PINE_TREES=[[-10,16],[10,17],[-12,25],[12,26],[-9,32],[9,33]];
function clampAndCollidePosition(x,z,prevX=x,prevZ=z){
 // 1. Giới hạn chiều sâu từ trong chánh điện (-8.0) ra hết toàn bộ sân ngoài trời (40.5)
 let nx=x,nz=Math.max(-8.0,Math.min(40.5,z));
 // 2. Giới hạn bề ngang: Trong chánh điện (z < 12.5) bị chặn bởi 2 tường bên (-6.3..6.3), ra ngoài sân (z >= 12.5) mở rộng tới (-18.5..18.5)
 if(nz<12.5){
  if(Math.abs(prevX)>6.35&&prevZ>=12.2){
   // Nếu đang ở ngoài sân rộng bên hông chánh điện thì chặn không cho đi xuyên qua mặt ngoài tường hông
   nz=Math.max(12.5,nz);
   nx=Math.max(-18.5,Math.min(18.5,nx));
  }else{
   nx=Math.max(-6.3,Math.min(6.3,nx));
  }
 }else{
  nx=Math.max(-18.5,Math.min(18.5,nx));
 }
 // 3. Chặn vùng bàn thờ chính phía sâu (-8.4)
 if(nz<-6.8&&Math.abs(nx)<3.4){
  nz=-6.8;
 }
 // 4. Chặn vùng bàn lễ vật & lư hương (x: -2.75..2.75, z: -5.5..-3.55)
 if(nx>-2.75&&nx<2.75&&nz>-5.55&&nz<-3.55){
  const dFront=Math.abs(nz - (-3.55));
  const dBack=Math.abs(nz - (-5.55));
  const dLeft=Math.abs(nx - (-2.75));
  const dRight=Math.abs(nx - 2.75);
  const minD=Math.min(dFront,dBack,dLeft,dRight);
  if(minD===dFront)nz=-3.55;
  else if(minD===dBack)nz=-5.55;
  else if(minD===dLeft)nx=-2.75;
  else nx=2.75;
 }
 // 5. Va chạm tròn mềm với 2 hàng cột đỏ (x = -5, 5)
 for(const pz of PILLAR_Z){
  for(const px of [-5,5]){
   const dx=nx-px,dz=nz-pz,dist=Math.hypot(dx,dz),minR=0.72;
   if(dist<minR&&dist>0.0001){
    nx=px+(dx/dist)*minR;
    nz=pz+(dz/dist)*minR;
   }
  }
 }
 // 6. Va chạm với 2 đèn đá ngoài sân (x = -3, 3; z = 14)
 for(const lx of [-3,3]){
  const dx=nx-lx,dz=nz-14,dist=Math.hypot(dx,dz),minR=0.75;
  if(dist<minR&&dist>0.0001){
   nx=lx+(dx/dist)*minR;
   nz=14+(dz/dist)*minR;
  }
 }
 // 7. Va chạm với thân 6 cây thông ngoài sân
 for(const [tx,tz] of PINE_TREES){
  const dx=nx-tx,dz=nz-tz,dist=Math.hypot(dx,dz),minR=0.85;
  if(dist<minR&&dist>0.0001){
   nx=tx+(dx/dist)*minR;
   nz=tz+(dz/dist)*minR;
  }
 }
 return[nx,nz];
}
