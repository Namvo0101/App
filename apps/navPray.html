<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thắp Nhang Cầu Nguyện</title>
<style>
:root{--bg:rgba(48,20,14,.86);--fg:#fff1d6;--ac:#f2b84b;--ac2:#d9534f;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1f0f0a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;z-index:0;inset:0;width:100%;height:100%;touch-action:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #ffe08a;outline-offset:3px}
#error{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:24px;background:#1f0f0a;color:var(--fg);text-align:center}
#error[hidden]{display:none}
#ui{position:fixed;z-index:10;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;justify-content:center;pointer-events:none;transition:opacity .4s}
#ui.hide{opacity:0;visibility:hidden}
.panel{pointer-events:auto;background:var(--bg);border:1px solid #f2b84b66;border-radius:18px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;backdrop-filter:blur(6px);max-width:640px}
h1{font-size:15px;margin:0 6px 0 2px;color:var(--ac);width:100%;text-align:center}
input{border:1px solid #f2b84b88;background:#00000040;color:var(--fg);padding:9px 12px;border-radius:12px;font-size:15px;width:150px;outline:none}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid #f2b84b88}
.seg button{background:#00000040;color:var(--fg);border:0;padding:9px 12px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ac);color:#3a1a0a;font-weight:700}
#pr{width:100%}
#vs{width:100%;font-size:12px;opacity:.85;text-align:center;line-height:1.35}
#go{background:linear-gradient(#ef7a4a,#c8382e);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0006}
#go:disabled,input:disabled,.seg.dis button{opacity:.55;cursor:not-allowed}
#snd{position:fixed;z-index:11;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--bg);border:1px solid #f2b84b66;color:var(--fg);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
</style></head><body>
<div id="ui"><div class="panel">
<h1>🪔 Thắp Nhang Cầu Nguyện 🪔</h1>
<label class="sr-only" for="nm">Tên của bạn</label><input id="nm" maxlength="18" placeholder="Nhập tên của bạn" autocomplete="off">
<div class="seg" id="sg" role="group" aria-label="Chọn nhân vật"><button type="button" data-g="m" class="on" aria-pressed="true">👦 Nam</button><button type="button" data-g="f" aria-pressed="false">👧 Nữ</button></div>
<label class="sr-only" for="pr">Lời cầu nguyện</label><input id="pr" maxlength="160" placeholder="Viết lời cầu nguyện của bạn…" value="Cầu cho gia đình bình an, sức khỏe, vạn sự như ý." autocomplete="off">
<div id="vs"></div>
<button id="go" type="button">🔥 Thắp nhang</button>
</div></div>
<button id="snd" type="button" title="Bật/Tắt nhạc nền và giọng cầu nguyện" aria-label="Tắt âm thanh" aria-pressed="true">🔊</button>
<div id="error" role="alert" hidden>Không thể khởi tạo cảnh 3D. Hãy kiểm tra kết nối mạng, bật WebGL trong trình duyệt hoặc thử trình duyệt khác rồi tải lại trang.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
try {
if(!window.THREE)throw new Error('Three.js chưa tải được');
// Tông nền nâu đỏ trầm ấm cúng
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1f0f0a);scene.fog=new THREE.Fog(0x1f0f0a,20,55);
const cam=new THREE.PerspectiveCamera(50,1,.1,120);
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);R.domElement.setAttribute('role','img');R.domElement.setAttribute('aria-label','Mô hình 3D chánh điện. Dùng phím mũi tên hoặc kéo để xoay góc nhìn.');R.domElement.tabIndex=0;
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d),C=(a,b,h,s=20)=>new THREE.CylinderGeometry(a,b,h,s),Sp=(r,s=20)=>new THREE.SphereGeometry(r,s,Math.max(6,s*.75|0));
const mk=(g,m,x=0,y=0,z=0,p=scene)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const RED=M(0xa3231b),GOLD=M(0xe6b84a,{metalness:.6,roughness:.35,emissive:0x3a2606}),WOOD=M(0x4a2012);

/* ---------- Môi trường ---------- */
scene.add(new THREE.HemisphereLight(0xffd9a0,0x3a1c12,.65));scene.add(new THREE.AmbientLight(0xffe2c0,.28));
const sun=new THREE.DirectionalLight(0xffe0b8,.75);sun.position.set(4,10,6);sun.target.position.set(0,0,-3);scene.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-9,right:9,top:12,bottom:-12,far:30});
mk(B(14,.2,22.5),M(0x6b4226),0,-.1,1.25);
mk(B(40,.2,30),M(0x8a8579),0,-.11,27.5);
mk(B(2.2,.02,32),M(0xb02a22),0,.01,10.5);
mk(B(14,6.6,.4),M(0x7a2a1c),0,3.3,-10);
[-7,7].forEach(x=>mk(B(.4,6.6,22.5),M(0x5a2418),x,3.3,1.25));
mk(B(15.6,.5,23),M(0x3a1d14),0,6.8,1.25);mk(B(15.6,.12,23),GOLD,0,6.5,1.25);
[12,8,4,0,-4,-8].forEach(z=>{[-5,5].forEach(x=>{mk(C(.3,.34,6.5),RED,x,3.25,z);mk(C(.45,.45,.2),GOLD,x,.1,z)});mk(B(14,.35,.4),M(0x7a1d15),0,6.3,z)});
[10,5,0,-5].forEach(z=>[-3,3].forEach(x=>{const g=new THREE.Group();g.position.set(x,4.6,z);scene.add(g);mk(C(.01,.01,1.2,4),WOOD,0,.9,0,g);const l=mk(Sp(.4),M(0xff3b20,{emissive:0xff3010,emissiveIntensity:.9}),0,0,0,g);l.scale.y=1.25;l.castShadow=false;mk(C(.25,.25,.08),GOLD,0,.5,0,g);mk(C(.25,.25,.08),GOLD,0,-.5,0,g)}));
const pl=[[0,4.8,6],[0,4.8,-1]].map(p=>{const l=new THREE.PointLight(0xffa850,1.15,15);l.position.set(...p);scene.add(l);return l});
// bàn thờ
mk(B(6,1.6,2.6),WOOD,0,.8,-8.4);mk(B(6.1,.1,2.7),GOLD,0,1.62,-8.4);
mk(C(1.1,1.35,.3,28),GOLD,0,1.8,-8.6);mk(Sp(1,24),GOLD,0,2.85,-8.6).scale.set(1,1.1,.8);mk(Sp(.55,24),GOLD,0,4.2,-8.5);mk(Sp(.2),GOLD,0,4.78,-8.5);
mk(new THREE.TorusGeometry(1.25,.06,10,40),M(0xffd36b,{emissive:0xffb020,emissiveIntensity:.8}),0,4.2,-9.1);
const sp=new THREE.SpotLight(0xffd9a0,1.4,16,.7,.5);sp.position.set(0,6,-4);sp.target.position.set(0,3,-8.6);scene.add(sp,sp.target);
mk(B(5,.1,1.1),M(0x5a2a14),0,1.0,-4.6);
[[-2.3,-4.15],[2.3,-4.15],[-2.3,-5.05],[2.3,-5.05]].forEach(([x,z])=>mk(B(.12,.95,.12),WOOD,x,.5,z));
mk(B(5,.8,.06),M(0xc0282a),0,.6,-4.07);mk(B(5.02,.08,.07),GOLD,0,.94,-4.07);
mk(C(.4,.27,.32,28),GOLD,0,1.21,-4.5);mk(C(.36,.36,.02,24),M(0x6e6a66),0,1.375,-4.5);
const flames=[];
[-1.8,1.8].forEach(x=>{mk(C(.1,.1,.5,12),M(0xfff4e0),x,1.3,-4.6);const f=mk(Sp(.07,10),M(0xffd24a,{emissive:0xffb020,emissiveIntensity:2}),x,1.62,-4.6);f.scale.y=1.7;f.castShadow=false;const l=new THREE.PointLight(0xffb347,.9,7);l.position.set(x,1.8,-4.4);scene.add(l);flames.push([f,l])});
[-1,1].forEach(x=>{const g=new THREE.Group();g.position.set(x*1.1,1.05,-4.7);scene.add(g);mk(Sp(.17),M(0xff9a2e),0,.17,0,g);mk(Sp(.17),M(0xff9a2e),.28,.17,0,g);mk(Sp(.15),M(0xe85a5a),.14,.4,0,g);mk(C(.4,.3,.05),GOLD,.14,.02,0,g)});
[-.6,.6].forEach(x=>{mk(C(.1,.07,.4),M(0x3b6ea5),x*1.4+.0,1.25,-4.9);[0,1,2,3].forEach(i=>mk(Sp(.1,10),M(i%2?0xff7fae:0xfff0f5),x*1.4+(i-1.5)*.07,1.55+(i%2)*.07,-4.9))});
mk(C(.55,.6,.14,24),M(0xc0282a),0,.07,-2.5);
// sân & cây
[[-10,16],[10,17],[-12,25],[12,26],[-9,32],[9,33]].forEach(([x,z])=>{mk(C(.25,.35,2.4),M(0x5a3a22),x,1.2,z);mk(new THREE.ConeGeometry(1.8,3.4,12),M(0x2f6b3f),x,3.6,z);mk(new THREE.ConeGeometry(1.3,2.6,12),M(0x3a8049),x,5.4,z)});
[-3,3].forEach(x=>{mk(B(.6,.5,.6),M(0x9a958a),x,.25,14);mk(B(.35,1.3,.35),M(0x9a958a),x,1.15,14);const l=mk(B(.55,.5,.55),M(0xffcf80,{emissive:0xffa030,emissiveIntensity:1}),x,2,14);l.castShadow=false;mk(B(.8,.15,.8),M(0x9a958a),x,2.35,14)});
// Bầu trời sao & bụi vàng lấp lánh trong chánh điện
{const p=[];for(let i=0;i<300;i++)p.push((Math.random()-.5)*160,18+Math.random()*30,-20-Math.random()*60);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.25,fog:false})))}
const dust=(()=>{const p=[];for(let i=0;i<140;i++)p.push((Math.random()-.5)*12,.4+Math.random()*5.4,-8+Math.random()*20);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xffd56b,size:.08,transparent:true,opacity:.6}));scene.add(pts);return pts})();

/* ---------- Nhang & khói ---------- */
const tipH=M(0xff6a20,{emissive:0xff5a10,emissiveIntensity:0}),tipB=M(0xff6a20,{emissive:0xff5a10,emissiveIntensity:2});
function mkInc(p,n,len,spread,tm){const g=new THREE.Group();p.add(g);const tips=[];for(let i=0;i<n;i++){const a=i/(n-1||1)-.5,s=new THREE.Group();s.rotation.z=-a*spread;s.rotation.x=i%2?.07:-.07;g.add(s);mk(C(.012,.012,len,6),M(0x8b2d1a),0,len/2,0,s);const t=mk(Sp(.03,8),tm,0,len,0,s);t.castShadow=false;tips.push(t)}return{g,tips}}
const bowlI=mkInc(scene,13,.6,.7,tipB);bowlI.g.position.set(0,1.37,-4.5);bowlI.g.visible=false;
const tx=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const sm=[];for(let i=0;i<80;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false,opacity:0,color:0xdddddd}));s.userData={l:0};scene.add(s);sm.push(s)}
const _v=new THREE.Vector3();
function emit(t){const s=sm.find(a=>a.userData.l<=0);if(!s)return;t.getWorldPosition(_v);s.position.copy(_v);s.userData={l:1,v:.3+Math.random()*.2,ph:Math.random()*6}}

/* ---------- Nhạc nền & giọng cầu nguyện ---------- */
let muted=false;
const music=new Audio('https://www.dropbox.com/scl/fi/v97i1bm55ctsgtdwzgm4y/Nh-c-Thi-n-T-nh-T-m.mp3?rlkey=mx3adj0a5wpu2skw57kn6xyx1&st=3nmx1f3a&raw=1');
music.loop=true;music.preload='none';music.volume=.28;
let musicRequested=false;
function startMusic(){if(muted||document.hidden)return;musicRequested=true;music.play().catch(e=>console.warn('Không phát được nhạc nền Dropbox:',e))}
function stopMusic(){music.pause()}
 $('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';$('snd').setAttribute('aria-pressed',String(!muted));$('snd').setAttribute('aria-label',muted?'Bật nhạc nền và giọng cầu nguyện':'Tắt nhạc nền và giọng cầu nguyện');if(muted){sb=false;stopMusic();try{speechSynthesis.cancel()}catch(e){}}else startMusic()};

/* ---------- Nhân vật & Tối ưu bảng tên ---------- */
let ch=null,P,held;
const gen=()=>document.querySelector('#sg .on').dataset.g;
// Dùng chung 1 canvas & texture cho bảng tên để tránh tràn bộ nhớ GPU khi gõ tên
const lbCv=document.createElement('canvas');lbCv.width=512;lbCv.height=128;
const lbTex=new THREE.CanvasTexture(lbCv);
function updateLabel(name){
 const x=lbCv.getContext('2d');x.clearRect(0,0,512,128);
 x.fillStyle='rgba(60,20,20,.78)';x.beginPath();(x.roundRect||x.rect).call(x,8,20,496,88,44);x.fill();
 x.strokeStyle='rgba(242,184,75,.6)';x.lineWidth=4;x.stroke();
 x.fillStyle='#ffe9b0';x.font='bold 52px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
 x.fillText(name,256,66,460);lbTex.needsUpdate=true;
 if(ch)ch.name=name;
}
function disposeCharacter(root){
 const geometries=new Set(),materials=new Set();
 root.traverse(o=>{
  if(o.geometry)geometries.add(o.geometry);
  const list=Array.isArray(o.material)?o.material:[o.material];
  list.filter(Boolean).forEach(m=>{if(m!==tipH)materials.add(m)});
 });
 geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());
}
function build(){
 if(ch){scene.remove(ch.root);disposeCharacter(ch.root)}
 bowlI.g.visible=false; // Làm mới bát hương cho lượt thắp mới
 const f=gen()==='f',name=$('nm').value.trim()||'Bạn';
 const skin=M(0xffd9b8,{roughness:.55}),top=M(f?0xff9fbd:0x4f86c6),bot=M(f?0xfff0f5:0x35435e),hr=M(f?0x1c1214:0x2a1a12,{roughness:.4});
 const root=new THREE.Group(),hip=new THREE.Group();hip.position.y=.75;root.add(hip);scene.add(root);
 const torso=new THREE.Group();hip.add(torso);
 mk(C(.26,.31,.72),top,0,.36,0,torso);mk(C(.32,.32,.07),M(f?0xffe066:0x8b5a2b),0,.03,0,torso);
 const leg=x=>{const g=new THREE.Group();g.position.set(x,0,0);hip.add(g);mk(C(.11,.1,.72),bot,0,-.36,0,g);mk(Sp(.14),M(0x7a3b2a),0,-.72,.05,g).scale.set(1,.6,1.3);return g};
 const legL=leg(.15),legR=leg(-.15);
 if(f)mk(C(.28,.5,.5,24),top,0,-.12,0,hip);
 const arm=x=>{const g=new THREE.Group();g.position.set(x,.6,0);torso.add(g);mk(C(.095,.085,.55),top,0,-.28,0,g);mk(Sp(.11),skin,0,-.58,0,g);return g};
 const armL=arm(.34),armR=arm(-.34);
 const head=new THREE.Group();head.position.y=.72;torso.add(head);
 mk(Sp(.4,28),skin,0,.4,0,head);
 const cap=mk(new THREE.SphereGeometry(.43,24,16,0,Math.PI*2,0,Math.PI*.52),hr,0,.47,-.02,head);cap.rotation.x=-.2;
 [-1,1].forEach(s=>mk(Sp(.07),skin,s*.4,.38,0,head));
 const eyes=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.15,.38,.36);head.add(g);mk(Sp(.06),M(0x1a1a1a),0,0,0,g).scale.set(1,1.3,.6);mk(Sp(.02,8),M(0xffffff,{emissive:0xffffff}),.018,.03,.03,g);mk(Sp(.07),M(0xff8fa3),s*.1,-.1,-.06,g).scale.set(1,.7,.4);return g});
 mk(new THREE.TorusGeometry(.06,.014,8,14,Math.PI),M(0x8a2f2f),0,.31,.385,head).rotation.z=Math.PI;
 if(f){mk(Sp(.43),hr,0,.3,-.1,head).scale.set(1,1.15,.85);[-1,1].forEach(s=>{mk(Sp(.13),hr,s*.4,.08,-.05,head);mk(Sp(.08),M(0xff5c8a),s*.34,.62,.12,head)});mk(Sp(.15),hr,0,.9,-.08,head)}
 else mk(Sp(.11),hr,0,.88,.08,head);
 held=mkInc(torso,5,.5,.25,tipH);held.g.position.set(0,.45,.53);
 const lb=new THREE.Sprite(new THREE.SpriteMaterial({map:lbTex,depthTest:false}));lb.scale.set(1.8,.45,1);lb.position.y=2.75;lb.renderOrder=9;root.add(lb);
 root.position.set(0,0,15.5);root.rotation.y=0;face=0;
 ch={root,hip,torso,head,legL,legR,armL,armR,eyes,name};P={...ID};tipH.emissiveIntensity=0;
 updateLabel(name);
}

/* ---------- Đọc lời cầu nguyện ---------- */
let sb=false,viV=null;
function pickVoice(){try{const a=speechSynthesis.getVoices();viV=a.find(v=>/^vi([-_]|$)/i.test(v.lang))||a.find(v=>/vietnam|hoaimy|namminh/i.test(v.name))||null}catch(e){viV=null}const e=$('vs');if(e)e.textContent=viV?'🔊 Giọng đọc tiếng Việt: '+viV.name:'⚠️ Máy chưa có giọng đọc tiếng Việt nên lời cầu nguyện chỉ hiện chữ. Hãy mở bằng Microsoft Edge (có giọng “HoaiMy”) hoặc cài giọng Vietnamese trong cài đặt hệ thống để nghe đọc.'}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice();setTimeout(pickVoice,400);setTimeout(pickVoice,1500)}else pickVoice();
function speak(t){sb=false;if(muted||!viV)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=viV;u.lang=viV.lang;u.rate=.85;u.pitch=1.05;u.onend=u.onerror=()=>{sb=false};sb=true;speechSynthesis.speak(u)}catch(e){sb=false}}

/* ---------- Kịch bản hoạt cảnh ---------- */
const ID={hipY:.75,leg:0,torso:0,head:0,arm:0,armZ:-.12,eye:0,incY:.45,incZ:.53};
const pz=o=>({...ID,...o});
let face=0,seq=[],si=0,st=0,from,wf,running=false,wa=0,wph=0,cm='idle';
let orb={a:0,p:0,drag:false,x:0,y:0}; // Biến điều khiển xoay camera tự do
const say=()=>{};
function mkSeq(nm,txt){
 const HOLD=pz({arm:-1.3,armZ:.6}),HANDS=pz({arm:-1.15,armZ:.6}),KN=pz({hipY:.2,leg:1.45,arm:-1.2,armZ:.6}),BOW=pz({hipY:.2,leg:1.45,torso:1.25,arm:-2.2,armZ:.15,eye:1});
 const s=[
  {d:1.8,p:HOLD,face:Math.PI,cm:'follow',msg:'Đang đốt nhang…'},
  {walk:[0,-3.7],speed:1.45,p:HOLD,msg:''},
  {d:1.5,p:pz({arm:-1.4,armZ:.5,torso:.35,incY:.5,incZ:.8,head:.25}),msg:'Cắm nhang vào bát…',end:()=>{held.g.visible=false;bowlI.g.visible=true}},
  {walk:[0,-2.5],speed:.75,p:pz({arm:-1.2,armZ:.6}),msg:'Lùi lại một chút để quỳ lạy…'},
  {d:1.2,p:KN,msg:'Quỳ xuống…'}];
 for(let i=1;i<=3;i++)s.push({d:1.3,p:BOW,msg:''},{d:.5,p:BOW,msg:''},{d:1.1,p:KN,msg:''});
 s.push(
  {d:1.4,p:HANDS,msg:'',on:()=>speak(txt)},
  {d:Math.max(4.2,txt.length*.09+1.5),wait:1,p:pz({arm:-1.15,armZ:.6,torso:.18,head:.5,eye:1}),msg:''},
  {d:1.3,p:pz({arm:-1.15,armZ:.6,torso:.32,head:.2}),msg:'Cúi đầu tạ ơn…'},
  {d:1,p:ID,face:0,cm:'exit',msg:'Xoay người đi ra…'},
  {walk:[0,17],speed:1.5,p:ID,msg:'Rời chánh điện…'});
 return s}
function startStep(){const s=seq[si];from={...P};st=0;wf=[ch.root.position.x,ch.root.position.z];s.dur=s.walk?Math.hypot(s.walk[0]-wf[0],s.walk[1]-wf[1])/s.speed:s.d;if(s.face!==undefined)face=s.face;if(s.cm){cm=s.cm;orb.a*=0.4;orb.p*=0.4}say(s.msg);s.on&&s.on()}
function finish(){running=false;try{speechSynthesis.cancel()}catch(e){}sb=false;say('Nguyện cầu bình an, vạn sự như ý 🙏');setTimeout(()=>{if(running)return;cm='idle';orb.a=orb.p=0;build();$('go').disabled=$('nm').disabled=$('pr').disabled=false;$('sg').classList.remove('dis');$('ui').classList.remove('hide');say('Bạn có thể thắp nhang lần nữa, hoặc đổi tên/giới tính.')},2200)}
$('go').onclick=()=>{if(running)return;startMusic();seq=mkSeq(ch.name,$('pr').value.trim()||'Cầu cho gia đình bình an, sức khỏe, vạn sự như ý.');si=0;running=true;$('go').disabled=$('nm').disabled=$('pr').disabled=true;$('sg').classList.add('dis');$('ui').classList.add('hide');startStep()};
 $('sg').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;document.querySelectorAll('#sg button').forEach(x=>{const active=x===b;x.classList.toggle('on',active);x.setAttribute('aria-pressed',String(active))});build()};
$('nm').oninput=()=>updateLabel($('nm').value.trim()||'Bạn');

/* ---------- Điều khiển xoay Camera bằng chuột/cảm ứng ---------- */
R.domElement.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;orb.drag=true;orb.x=e.clientX;orb.y=e.clientY;R.domElement.setPointerCapture(e.pointerId)});
R.domElement.addEventListener('pointermove',e=>{if(!orb.drag)return;orb.a=Math.max(-1.4,Math.min(1.4,orb.a-(e.clientX-orb.x)*.006));orb.p=Math.max(-.6,Math.min(1.8,orb.p+(e.clientY-orb.y)*.005));orb.x=e.clientX;orb.y=e.clientY});
const stopDrag=()=>{orb.drag=false};
R.domElement.addEventListener('pointerup',stopDrag);R.domElement.addEventListener('pointercancel',stopDrag);R.domElement.addEventListener('lostpointercapture',stopDrag);
R.domElement.addEventListener('keydown',e=>{const step=.08;if(e.key==='ArrowLeft')orb.a=Math.max(-1.4,orb.a-step);else if(e.key==='ArrowRight')orb.a=Math.min(1.4,orb.a+step);else if(e.key==='ArrowUp')orb.p=Math.max(-.6,orb.p-step);else if(e.key==='ArrowDown')orb.p=Math.min(1.8,orb.p+step);else return;e.preventDefault()});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopMusic();try{if(sb)speechSynthesis.pause()}catch(e){}}
 else{if(musicRequested&&!muted)startMusic();try{if(sb)speechSynthesis.resume()}catch(e){}}
});

/* ---------- Vòng lặp ---------- */
const clock=new THREE.Clock(),cp=new THREE.Vector3(),lk=new THREE.Vector3(),lkc=new THREE.Vector3(0,1.4,15);let tt=0,sacc=0;
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?70:50;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();build();cam.position.set(2.6,2.4,19.4);
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);tt+=dt;let wk=0;
 if(running){const s=seq[si];st+=dt;if(s.wait&&sb&&st>=s.dur&&(s.w=(s.w||0)+dt)<25)st=s.dur-.001;const k=Math.min(st/s.dur,1),e=k*k*(3-2*k);
  for(const key in P)P[key]=from[key]+(s.p[key]-from[key])*e;
  if(s.walk){const m=k*k*(3-2*k);wk=Math.sin(k*Math.PI);ch.root.position.x=wf[0]+(s.walk[0]-wf[0])*m;ch.root.position.z=wf[1]+(s.walk[1]-wf[1])*m}
  if(k>=1){s.end&&s.end();si++;if(si>=seq.length)finish();else startStep()}}
 wa+=(wk-wa)*Math.min(1,dt*4.5);wph+=dt*6.2*wa;
 const r=ch.root,d=Math.atan2(Math.sin(face-r.rotation.y),Math.cos(face-r.rotation.y));r.rotation.y+=d*Math.min(1,dt*4);
 const sw=P.arm>-.6?wa:0,sn=Math.sin(wph);
 ch.hip.position.y=P.hipY+Math.abs(sn)*.035*wa;
 ch.legL.rotation.x=P.leg+sn*.45*wa;ch.legR.rotation.x=P.leg-sn*.45*wa;
 ch.armL.rotation.set(P.arm-sn*.38*sw,0,-P.armZ);ch.armR.rotation.set(P.arm+sn*.38*sw,0,P.armZ);
 ch.torso.rotation.x=P.torso;ch.torso.scale.y=1+Math.sin(tt*2.2)*.012;
 ch.head.rotation.x=P.head;ch.head.rotation.z=Math.sin(tt*1.6)*.05;
 ch.eyes.forEach(e=>e.scale.y=Math.max(.12,1-P.eye*.9));
 held.g.position.set(0,P.incY,P.incZ);
 tipH.emissiveIntensity=(running&&held.g.visible)?Math.min(2,tipH.emissiveIntensity+dt*1.5):0;
 sacc+=dt;if(sacc>.12){sacc=0;if(running&&held.g.visible&&tipH.emissiveIntensity>.5)emit(held.tips[Math.random()*5|0]);if(bowlI.g.visible&&Math.random()<.9)emit(bowlI.tips[Math.random()*13|0])}
 sm.forEach(s=>{const u=s.userData;if(u.l>0){u.l-=dt/3.5;s.position.y+=u.v*dt;s.position.x+=Math.sin(u.ph+tt*1.3)*.12*dt;const k=1-u.l;s.scale.setScalar(.12+k*.7);s.material.opacity=Math.max(0,u.l)*.4}else s.material.opacity=0});
 flames.forEach(([f,l],i)=>{const q=1+Math.sin(tt*14+i*3)*.15+Math.random()*.08;f.scale.set(q,1.7*q,q);l.intensity=.8+Math.sin(tt*11+i)*.15});
 pl.forEach((l,i)=>l.intensity=1.15+Math.sin(tt*3+i)*.08);
 dust.position.y=Math.sin(tt*.7)*.12;dust.rotation.y=tt*.02;
 if(cm==='idle'){lk.set(0,1.4,15.5);cp.set(lk.x+Math.sin(.55+orb.a)*4.6,2.4+orb.p,lk.z+Math.cos(.55+orb.a)*4.6)}
 else if(cm==='follow'){lk.set(0,1.6,r.position.z-1.5);const dist=Math.max(5.5,Math.min(7.5,r.position.z+7.5));cp.set(lk.x+Math.sin(.38+orb.a)*dist,2.9+orb.p,lk.z+Math.cos(.38+orb.a)*dist)}
 else{lk.set(0,1.3,r.position.z);cp.set(lk.x+Math.sin(.9+orb.a)*5.5,2.8+orb.p,lk.z+Math.cos(.9+orb.a)*5.5)}
 cam.position.lerp(cp,1-Math.exp(-dt*2.5));lkc.lerp(lk,1-Math.exp(-dt*4));cam.lookAt(lkc);
 R.render(scene,cam)}
loop();
} catch(error) {
 console.error('Không thể khởi tạo cảnh 3D:',error);
 $('error').hidden=false;
}
</script></body></html>
