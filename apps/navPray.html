<style>

input{width:150px}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid #f2b84b88}
.seg button{background:#00000040;color:var(--fg);border:0;padding:9px 12px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ac);color:#3a1a0a;font-weight:700}
#pr{width:100%}
#vs{width:100%;font-size:12px;opacity:.85;text-align:center;line-height:1.35}
#go{background:linear-gradient(#ef7a4a,#c8382e);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0006}

[hidden]{display:none!important}
#people-fields{width:100%;display:grid;gap:8px}
.person-card{width:100%;padding:9px;background:#0002;border:1px solid #f2b84b44;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:center}

.person-card input{width:100%;min-width:0}
.person-card .person-pr{grid-column:1/-1}

.person-gender button{flex:1}

</style></head><body>
<div id="ui"><div class="panel">

</div></div>

<div id="error" role="alert" hidden>Không thể khởi tạo cảnh 3D. Hãy kiểm tra kết nối mạng, bật WebGL trong trình duyệt hoặc thử trình duyệt khác rồi tải lại trang.</div>

<script>
const $=id=>document.getElementById(id);

mk(B(14,6.6,.4),M(0x7a2a1c),0,3.3,-10);
[-7,7].forEach(x=>mk(B(.4,6.6,22.5),M(0x5a2418),x,3.3,1.25));

[12,8,4,0,-4,-8].forEach(z=>{[-5,5].forEach(x=>{mk(C(.3,.34,6.5),RED,x,3.25,z);mk(C(.45,.45,.2),GOLD,x,.1,z)});mk(B(14,.35,.4),M(0x7a1d15),0,6.3,z)});
[10,5,0,-5].forEach(z=>[-3,3].forEach(x=>{const g=new THREE.Group();g.position.set(x,4.6,z);scene.add(g);mk(C(.01,.01,1.2,4),WOOD,0,.9,0,g);const l=mk(Sp(.4),M(0xff3b20,{emissive:0xff3010,emissiveIntensity:.9}),0,0,0,g);l.scale.y=1.25;l.castShadow=false;mk(C(.25,.25,.08),GOLD,0,.5,0,g);mk(C(.25,.25,.08),GOLD,0,-.5,0,g)}));

mk(new THREE.TorusGeometry(1.25,.06,10,40),M(0xffd36b,{emissive:0xffb020,emissiveIntensity:.8}),0,4.2,-9.1);
const sp=new THREE.SpotLight(0xffd9a0,1.4,16,.7,.5);sp.position.set(0,6,-4);sp.target.position.set(0,3,-8.6);scene.add(sp,sp.target);
mk(B(5,.1,1.1),M(0x5a2a14),0,1.0,-4.6);
[[-2.3,-4.15],[2.3,-4.15],[-2.3,-5.05],[2.3,-5.05]].forEach(([x,z])=>mk(B(.12,.95,.12),WOOD,x,.5,z));
mk(B(5,.8,.06),M(0xc0282a),0,.6,-4.07);mk(B(5.02,.08,.07),GOLD,0,.94,-4.07);
mk(C(.4,.27,.32,28),GOLD,0,1.21,-4.5);mk(C(.36,.36,.02,24),M(0x6e6a66),0,1.375,-4.5);
const flames=[];
[-1.8,1.8].forEach(x=>{mk(C(.1,.1,.5,12),M(0xfff4e0),x,1.3,-4.6);const f=mk(Sp(.07,10),M(0xffd24a,{emissive:0xffb020,emissiveIntensity:2}),x,1.62,-4.6);f.scale.y=1.7;f.castShadow=false;const l=new THREE.PointLight(0xffb347,.9,7);l.position.set(x,1.8,-4.4);scene.add(l);flames.push([f,l])});
[-1,1].forEach(x=>{const g=new THREE.Group();g.position.set(x*1.1,1.05,-4.7);scene.add(g);mk(Sp(.17),M(0xff9a2e),0,.17,0,g);mk(Sp(.17),M(0xff9a2e),.28,.17,0,g);mk(Sp(.15),M(0xe85a5a),.14,.4,0,g);mk(C(.4,.3,.05),GOLD,.14,.02,0,g)});
[-.6,.6].forEach(x=>{mk(C(.1,.07,.4),M(0x3b6ea5),x*1.4+.0,1.25,-4.9);[0,1,2,3].forEach(i=>mk(Sp(.1,10),M(i%2?0xff7fae:0xfff0f5),x*1.4+(i-1.5)*.07,1.55+(i%2)*.07,-4.9))});
mk(C(.55,.6,.14,24),M(0xc0282a),0,.07,-2.5);
// sân & cây
[[-10,16],[10,17],[-12,25],[12,26],[-9,32],[9,33]].forEach(([x,z])=>{mk(C(.25,.35,2.4),M(0x5a3a22),x,1.2,z);mk(new THREE.ConeGeometry(1.8,3.4,12),M(0x2f6b3f),x,3.6,z);mk(new THREE.ConeGeometry(1.3,2.6,12),M(0x3a8049),x,5.4,z)});
[-3,3].forEach(x=>{mk(B(.6,.5,.6),M(0x9a958a),x,.25,14);mk(B(.35,1.3,.35),M(0x9a958a),x,1.15,14);const l=mk(B(.55,.5,.55),M(0xffcf80,{emissive:0xffa030,emissiveIntensity:1}),x,2,14);l.castShadow=false;mk(B(.8,.15,.8),M(0x9a958a),x,2.35,14)});
// Bầu trời sao & bụi vàng lấp lánh trong chánh điện
{const p=[];for(let i=0;i<300;i++)p.push((Math.random()-.5)*160,18+Math.random()*30,-20-Math.random()*60);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.25,fog:false})))}
const dust=(()=>{const p=[];for(let i=0;i<140;i++)p.push((Math.random()-.5)*12,.4+Math.random()*5.4,-8+Math.random()*20);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xffd56b,size:.08,transparent:true,opacity:.6}));scene.add(pts);return pts})();

/* ---------- Nhang & khói ---------- */
const tipB=M(0xff6a20,{emissive:0xff5a10,emissiveIntensity:2});
function mkInc(p,n,len,spread,tm){const g=new THREE.Group();p.add(g);const tips=[];for(let i=0;i<n;i++){const a=i/(n-1||1)-.5,s=new THREE.Group();s.rotation.z=-a*spread;s.rotation.x=i%2?.07:-.07;g.add(s);mk(C(.012,.012,len,6),M(0x8b2d1a),0,len/2,0,s);const t=mk(Sp(.03,8),tm,0,len,0,s);t.castShadow=false;tips.push(t)}return{g,tips}}
const bowlI=mkInc(scene,13,.6,.7,tipB);bowlI.g.position.set(0,1.37,-4.5);bowlI.g.visible=false;
const tx=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const sm=[];for(let i=0;i<80;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false,opacity:0,color:0xdddddd}));s.userData={l:0};scene.add(s);sm.push(s)}
const _v=new THREE.Vector3();
function emit(t){const s=sm.find(a=>a.userData.l<=0);if(!s)return;t.getWorldPosition(_v);s.position.copy(_v);s.userData={l:1,v:.3+Math.random()*.2,ph:Math.random()*6}}

/* ---------- Nhạc nền & giọng cầu nguyện ---------- */
function stopMusic(){music.pause()}
$('snd').onclick=()=>{if(musicBlocked&&!muted){startMusic(true);return}muted=!muted;$('snd').textContent=muted?'🔇':'🔊';$('snd').setAttribute('aria-pressed',String(!muted));$('snd').setAttribute('aria-label',muted?'Bật nhạc nền và giọng cầu nguyện':'Tắt nhạc nền và giọng cầu nguyện');if(muted){cancelSpeech();stopMusic()}else startMusic(true)};

/* ---------- Nhân vật & Tối ưu bảng tên ---------- */
let ch=null,P,held,actors=[],people=[],activeIndex=0,phase='idle',groupWalkFrom=[];
const DEFAULT_PRAYER='Cầu cho gia đình bình an, sức khỏe, vạn sự như ý.';
function updateLabel(name,actor=ch){
 if(!actor)return;
 const x=actor.labelCanvas.getContext('2d');x.clearRect(0,0,512,128);
 x.fillStyle='#ffe9b0';x.shadowColor='rgba(25,8,4,.95)';x.shadowBlur=8;x.shadowOffsetX=1;x.shadowOffsetY=2;
 x.font='bold 52px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
 x.fillText(name,256,66,460);actor.labelTexture.needsUpdate=true;actor.name=name;
}
function disposeCharacter(root){
 const geometries=new Set(),materials=new Set(),textures=new Set();
 root.traverse(o=>{
  if(o.geometry)geometries.add(o.geometry);
  const list=Array.isArray(o.material)?o.material:[o.material];
  list.filter(Boolean).forEach(m=>{materials.add(m);Object.values(m).forEach(v=>{if(v&&v.isTexture)textures.add(v)})});
 });
 geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());
}
function addFlower(parent,x,y,z,r,petalMat,centerMat){
 for(let i=0;i<5;i++){
  const a=-Math.PI/2+i*Math.PI*2/5,p=mk(Sp(r*.48,8),petalMat,x+Math.cos(a)*r*.58,y+Math.sin(a)*r*.58,z,parent);
  p.scale.set(1,1,.42);
 }
 mk(Sp(r*.34,8),centerMat,x,y,z+.015,parent);
}

 if(replace&&ch){scene.remove(ch.root);disposeCharacter(ch.root)}
 const f=person.gender==='f',name=person.name||'Bạn';
 const skin=M(0xffd9b8,{roughness:.55}),top=M(f?0xe987a8:0x5795ad),bot=M(f?0xf8d9e4:0x40566f),hr=M(f?0x1c1214:0x2a1a12,{roughness:.4});

 mk(Sp(.075,12),sash,0,.075,.315,torso);

 };
 const legL=leg(.15),legR=leg(-.15);
 if(f){

 }

 const armL=arm(.34),armR=arm(-.34);

 mk(Sp(.4,28),skin,0,.4,0,head);

 const eyes=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.15,.38,.36);head.add(g);mk(Sp(.06),M(0x1a1a1a),0,0,0,g).scale.set(1,1.3,.6);mk(Sp(.02,8),M(0xffffff,{emissive:0xffffff}),.018,.03,.03,g);mk(Sp(.07),M(0xff8fa3),s*.1,-.1,-.06,g).scale.set(1,.7,.4);return g});
 mk(new THREE.TorusGeometry(.06,.014,8,14,Math.PI),M(0x8a2f2f),0,.31,.385,head).rotation.z=Math.PI;
 if(f){mk(Sp(.43),hr,0,.3,-.1,head).scale.set(1,1.15,.85);[-1,1].forEach(s=>{mk(Sp(.13),hr,s*.4,.08,-.05,head);mk(Sp(.08),M(0xff5c8a),s*.34,.62,.12,head)});mk(Sp(.15),hr,0,.9,-.08,head)}
 else mk(Sp(.11),hr,0,.88,.08,head);
 const tipMaterial=M(0xff6a20,{emissive:0xff5a10,emissiveIntensity:0});
 held=mkInc(torso,5,.5,.25,tipMaterial);held.g.position.set(0,.45,.53);
 const labelCanvas=document.createElement('canvas');labelCanvas.width=512;labelCanvas.height=128;
 const labelTexture=new THREE.CanvasTexture(labelCanvas);
 const lb=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture,depthTest:false}));lb.scale.set(1.45,.36,1);lb.position.y=1.24;lb.renderOrder=9;head.add(lb);
 root.position.set(0,0,15.5);root.rotation.y=Math.PI;
 ch={root,hip,torso,head,legL,legR,armL,armR,eyes,name,held,tipMaterial,labelCanvas,labelTexture,P:{...ID},laneX:0};
 P=ch.P;face=Math.PI;updateLabel(name,ch);return ch;
}
function makePersonCard(person,index){
 const card=document.createElement('section');card.className='person-card';card.dataset.index=index;
 const title=document.createElement('strong');title.textContent=`Người cầu nguyện ${index+1}`;card.append(title);
 const name=document.createElement('input');name.type='text';name.maxLength=18;name.autocomplete='off';name.placeholder='Tên người cầu nguyện';name.setAttribute('aria-label',`Tên người cầu nguyện ${index+1}`);name.dataset.field='name';name.value=person.name||'';card.append(name);
 const gender=document.createElement('div');gender.className='seg person-gender';gender.setAttribute('role','group');gender.setAttribute('aria-label',`Nhân vật ${index+1}`);
 [['m','👦 Nam'],['f','👧 Nữ']].forEach(([value,label])=>{const button=document.createElement('button');button.type='button';button.dataset.gender=value;button.textContent=label;button.classList.toggle('on',(person.gender||'m')===value);button.setAttribute('aria-pressed',String((person.gender||'m')===value));gender.append(button)});card.append(gender);
 const prayer=document.createElement('input');prayer.type='text';prayer.maxLength=160;prayer.autocomplete='off';prayer.placeholder='Hãy nhập nội dung cầu nguyện';prayer.setAttribute('aria-label',`Lời cầu nguyện của người ${index+1}`);prayer.dataset.field='prayer';prayer.className='person-pr';prayer.value=person.prayer||'';card.append(prayer);

}
function readPeopleForm(){
 return [...$('people-fields').querySelectorAll('.person-card')].map((card,index)=>({
  name:card.querySelector('[data-field="name"]').value.trim()||`Người ${index+1}`,
  gender:card.querySelector('.person-gender .on')?.dataset.gender||'m',
  prayer:card.querySelector('[data-field="prayer"]').value.trim()

}
function activateActor(actor){ch=actor;P=actor.P;held=actor.held;face=actor.root.rotation.y}
function makeParticipants(data=people){
 actors.forEach(actor=>{scene.remove(actor.root);disposeCharacter(actor.root)});
 actors=[];ch=null;bowlI.g.visible=false;
 data.forEach((person,index)=>{
  const actor=build(person,false);actor.laneX=(index-(data.length-1)/2)*1.05;
  actor.root.position.set(actor.laneX,0,15.5);actor.root.rotation.y=Math.PI;actor.held.g.visible=true;
  actors.push(actor);
 });

function renderPeopleForm(count,previous=[]){

$('people-fields').addEventListener('input',e=>{
 if(running)return;const card=e.target.closest('.person-card');if(!card)return;

});
$('people-fields').addEventListener('click',e=>{
 const button=e.target.closest('.person-gender button');if(!button||running)return;
 const group=button.parentElement;group.querySelectorAll('button').forEach(item=>{const on=item===button;item.classList.toggle('on',on);item.setAttribute('aria-pressed',String(on))});

/* ---------- Đọc lời cầu nguyện bằng TTS tiếng Việt trực tuyến ---------- */
let sb=false,speechToken=0,ttsAud=null;
const voiceStatus=$('vs');if(voiceStatus)voiceStatus.textContent='🔊 Lời cầu nguyện sẽ được đọc bằng giọng tiếng Việt trực tuyến.';

function setDuck(on){
 sb=on;
}
function resumeBackgroundMusic(){
 if(musicRequested&&!muted&&!document.hidden&&music.paused)startMusic();
}
function cancelSpeech(){
 speechToken++;
 setDuck(false);
 if(ttsAud){try{ttsAud.pause();ttsAud.onended=ttsAud.onerror=null;ttsAud.removeAttribute('src');ttsAud.load()}catch(e){}}
}
function splitChunks(t){
 return t.match(/[^.!?,;]+[.!?,;]?/g)?.map(s=>s.trim()).filter(Boolean)||[t];
}
function playOnlineTTS(text,token){
 const chunks=splitChunks(text);let idx=0;
 setDuck(true);
 resumeBackgroundMusic();
 const next=()=>{
  if(muted||token!==speechToken||idx>=chunks.length){if(token===speechToken){setDuck(false);resumeBackgroundMusic()}return}
  const q=encodeURIComponent(chunks[idx++].slice(0,180));
  if(!ttsAud){ttsAud=new Audio();ttsAud.playsInline=true}
  ttsAud.src=`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=vi&q=${q}`;
  ttsAud.playbackRate=.95;
  ttsAud.onended=next;
  ttsAud.onerror=()=>{if(token===speechToken){setDuck(false);resumeBackgroundMusic()}};
  const p=ttsAud.play();
  if(p&&typeof p.catch==='function')p.catch(()=>{if(token===speechToken){setDuck(false);resumeBackgroundMusic()}});
 };
 next();
}
function unlockSpeech(){
 try{
  if(!ttsAud){ttsAud=new Audio();ttsAud.playsInline=true}
  ttsAud.preload='auto';ttsAud.volume=1;ttsAud.muted=false;
  ttsAud.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  const p=ttsAud.play();if(p&&typeof p.catch==='function')p.catch(()=>{});
 }catch(e){}
}
function speak(t){
 // Lời trước đã kết thúc trong sequence; không gọi cancel ở đây vì iOS có thể
 // xem việc hủy TTS/đặt lại audio element là mất quyền phát đã mở từ thao tác chạm.
 speechToken++;setDuck(false);
 if(muted||!t)return;
 // Chỉ dùng TTS trực tuyến tiếng Việt, không gọi giọng đọc của hệ thống.
 playOnlineTTS(t,speechToken);
}

/* ---------- Kịch bản hoạt cảnh ---------- */
const ID={hipY:.75,leg:0,torso:0,head:0,arm:0,armZ:-.12,eye:0,incY:.45,incZ:.53};
const pz=o=>({...ID,...o});
let face=0,seq=[],si=0,st=0,from,wf,running=false,wa=0,wph=0,cm='idle';
let orb={a:0,p:0,drag:false,x:0,y:0}; // Biến điều khiển xoay camera tự do
const say=()=>{};
function mkOfferSeq(actor){
 const HOLD=pz({arm:-1.3,armZ:.6}),KN=pz({hipY:.2,leg:1.45,arm:-1.2,armZ:.6});
 return[
  {walk:[0,-3.7],speed:.9,p:HOLD,face:Math.PI,cm:'follow'},
  {d:1.35,p:pz({arm:-1.4,armZ:.5,torso:.35,incY:.5,incZ:.8,head:.25}),end:()=>{actor.held.g.visible=false;bowlI.g.visible=true}},
  {walk:[actor.laneX,-2.5],speed:.9,p:HOLD},
  {d:1.1,p:KN}
 ];
}
function beginGroupApproach(){
 const HOLD=pz({arm:-1.3,armZ:.6});
 phase='approach';cm='follow';activeIndex=0;
 actors.forEach(a=>{a.P={...ID};a.held.g.visible=true;a.tipMaterial.emissiveIntensity=0;a.root.position.set(a.laneX,0,15.5);a.root.rotation.y=Math.PI});
 activateActor(actors[0]);P=actors[0].P;face=Math.PI;
 seq=[{d:1.6,p:HOLD,face:Math.PI,cm:'follow'},{walkGroupZ:-3.7,speed:1.45,p:HOLD}];si=0;startStep();
}
function mkGroupSeq(){
 const KN=pz({hipY:.2,leg:1.45,arm:-1.2,armZ:.6});
 const BOW=pz({hipY:.2,leg:1.45,torso:1.25,arm:-2.2,armZ:.15,eye:1});
 const HANDS=pz({arm:-1.15,armZ:.6,torso:.18,head:.5,eye:1});
 const s=[];
 for(let i=0;i<3;i++)s.push({d:1.3,p:BOW},{d:.5,p:BOW},{d:1.1,p:KN});
 const speechFor=person=>`Lời cầu nguyện của ${person.name}: ${person.prayer||DEFAULT_PRAYER}`;
 const firstPrayer=speechFor(people[0]);
 s.push({d:1.4,p:HANDS,on:()=>speak(firstPrayer)});
 s.push({d:Math.max(4.2,firstPrayer.length*.09+1.5),wait:1,p:HANDS});
 for(let i=1;i<people.length;i++){
  const prayer=speechFor(people[i]);
  s.push({d:Math.max(4.2,prayer.length*.09+1.5),wait:1,p:HANDS,on:()=>speak(prayer)});
 }
 s.push({d:1.1,p:ID,face:0,cm:'exit'},{walkGroupZ:17,speed:1.5,p:ID});
 return s;
}
function startStep(){
 const s=seq[si];from={...P};st=0;wf=[ch.root.position.x,ch.root.position.z];
 if(s.walk)s.dur=Math.hypot(s.walk[0]-wf[0],s.walk[1]-wf[1])/s.speed;
 else if(s.walkGroupZ!==undefined){s.dur=Math.abs(s.walkGroupZ-ch.root.position.z)/s.speed;groupWalkFrom=actors.map(a=>[a.root.position.x,a.root.position.z])}
 else s.dur=s.d;
 if(s.face!==undefined)face=s.face;
 if(s.cm){cm=s.cm;orb.a*=.4;orb.p*=.4}
 say(s.msg);if(s.on)s.on();
}
function beginOffer(index){
 activeIndex=index;activateActor(actors[index]);ch.root.position.set(ch.laneX,0,-3.7);ch.root.rotation.y=Math.PI;
 ch.held.g.visible=true;ch.tipMaterial.emissiveIntensity=0;P={...ID};ch.P=P;face=Math.PI;
 phase='offer';seq=mkOfferSeq(ch);si=0;startStep();
}
function beginGroupRitual(){
 phase='group';cm='follow';activeIndex=0;actors.forEach(a=>{a.P=pz({hipY:.2,leg:1.45,arm:-1.2,armZ:.6});a.held.g.visible=false});
 activateActor(actors[0]);P=actors[0].P;face=Math.PI;seq=mkGroupSeq();si=0;startStep();
}
function finish(){
 running=false;phase='idle';cancelSpeech();
 setTimeout(()=>{if(running)return;cm='idle';orb.a=orb.p=0;makeParticipants(people);$('go').disabled=false;$('count-back').disabled=false;$('people-fields').querySelectorAll('input,button').forEach(el=>el.disabled=false);$('ui').classList.remove('hide')},900);
}
$('go').onclick=()=>{
 if(running||!actors.length)return;people=readPeopleForm();makeParticipants(people);
 startMusic(true);unlockSpeech();running=true;activeIndex=0;beginGroupApproach();
 $('go').disabled=true;$('count-back').disabled=true;$('people-fields').querySelectorAll('input,button').forEach(el=>el.disabled=true);$('ui').classList.add('hide');
};

/* ---------- Điều khiển xoay Camera bằng chuột/cảm ứng ---------- */
R.domElement.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;orb.drag=true;orb.x=e.clientX;orb.y=e.clientY;R.domElement.setPointerCapture(e.pointerId)});
R.domElement.addEventListener('pointermove',e=>{if(!orb.drag)return;orb.a=Math.max(-1.4,Math.min(1.4,orb.a-(e.clientX-orb.x)*.006));orb.p=Math.max(-.6,Math.min(1.8,orb.p+(e.clientY-orb.y)*.005));orb.x=e.clientX;orb.y=e.clientY});
const stopDrag=()=>{orb.drag=false};
R.domElement.addEventListener('pointerup',stopDrag);R.domElement.addEventListener('pointercancel',stopDrag);R.domElement.addEventListener('lostpointercapture',stopDrag);
R.domElement.addEventListener('keydown',e=>{const step=.08;if(e.key==='ArrowLeft')orb.a=Math.max(-1.4,orb.a-step);else if(e.key==='ArrowRight')orb.a=Math.min(1.4,orb.a+step);else if(e.key==='ArrowUp')orb.p=Math.max(-.6,orb.p-step);else if(e.key==='ArrowDown')orb.p=Math.min(1.8,orb.p+step);else return;e.preventDefault()});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(ttsAud&&!ttsAud.paused)try{ttsAud.pause()}catch(e){}}
 else{if(musicRequested&&!muted)startMusic();if(sb&&ttsAud&&ttsAud.paused&&ttsAud.src&&!muted)try{ttsAud.play()}catch(e){}}
});

/* ---------- Vòng lặp ---------- */
const clock=new THREE.Clock(),cp=new THREE.Vector3(),lk=new THREE.Vector3(),lkc=new THREE.Vector3(0,1.4,15);let tt=0,sacc=0;
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?70:50;cam.updateProjectionMatrix()}
function animateActor(actor,pose,dt,walkWeight){
 const r=actor.root,d=Math.atan2(Math.sin(face-r.rotation.y),Math.cos(face-r.rotation.y));r.rotation.y+=d*Math.min(1,dt*4);
 const sw=pose.arm>-.6?walkWeight:0,sn=Math.sin(wph);
 actor.hip.position.y=pose.hipY+Math.abs(sn)*.035*walkWeight;
 actor.legL.rotation.x=pose.leg+sn*.45*walkWeight;actor.legR.rotation.x=pose.leg-sn*.45*walkWeight;
 actor.armL.rotation.set(pose.arm-sn*.38*sw,0,-pose.armZ);actor.armR.rotation.set(pose.arm+sn*.38*sw,0,pose.armZ);
 actor.torso.rotation.x=pose.torso;actor.torso.scale.y=1+Math.sin(tt*2.2)*.012;
 actor.head.rotation.x=pose.head;actor.head.rotation.z=Math.sin(tt*1.6)*.05;
 actor.eyes.forEach(e=>e.scale.y=Math.max(.12,1-pose.eye*.9));
 actor.held.g.position.set(0,pose.incY,pose.incZ);
 const lit=running&&((phase==='approach'&&si>=1)||(phase==='offer'&&actor===ch&&si<=1))&&actor.held.g.visible;
 actor.tipMaterial.emissiveIntensity=lit?Math.min(2,actor.tipMaterial.emissiveIntensity+dt*1.5):0;
}
function sequenceFinished(){
 if(phase==='approach')beginOffer(0);
 else if(phase==='offer'&&activeIndex+1<actors.length)beginOffer(activeIndex+1);
 else if(phase==='offer')beginGroupRitual();
 else finish();
}
addEventListener('resize',resize);resize();makeParticipants([{name:'Người 1',gender:'m',prayer:''}]);cam.position.set(2.6,2.4,19.4);
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);tt+=dt;let wk=0;
 if(running){const s=seq[si];st+=dt;if(s.wait&&sb&&st>=s.dur&&(s.w=(s.w||0)+dt)<25)st=s.dur-.001;const k=Math.min(st/s.dur,1),e=k*k*(3-2*k);
  for(const key in P)P[key]=from[key]+(s.p[key]-from[key])*e;
  if(s.walk||s.walkGroupZ!==undefined){const m=k*k*(3-2*k);wk=Math.sin(k*Math.PI);
   if(s.walk){ch.root.position.x=wf[0]+(s.walk[0]-wf[0])*m;ch.root.position.z=wf[1]+(s.walk[1]-wf[1])*m}
   else actors.forEach((a,i)=>{a.root.position.x=groupWalkFrom[i][0];a.root.position.z=groupWalkFrom[i][1]+(s.walkGroupZ-groupWalkFrom[i][1])*m});
  }
  if(k>=1){if(s.end)s.end();si++;if(si>=seq.length)sequenceFinished();else startStep()}}
 wa+=(wk-wa)*Math.min(1,dt*4.5);wph+=dt*6.2*wa;
 actors.forEach(a=>animateActor(a,phase==='group'||phase==='approach'?P:a.P,dt,phase==='group'||phase==='approach'||a===ch?wa:0));
 sacc+=dt;if(sacc>.12){sacc=0;if(running&&held.g.visible&&ch.tipMaterial.emissiveIntensity>.5)emit(held.tips[Math.random()*5|0]);if(bowlI.g.visible&&Math.random()<.9)emit(bowlI.tips[Math.random()*13|0])}
 sm.forEach(s=>{const u=s.userData;if(u.l>0){u.l-=dt/3.5;s.position.y+=u.v*dt;s.position.x+=Math.sin(u.ph+tt*1.3)*.12*dt;const k=1-u.l;s.scale.setScalar(.12+k*.7);s.material.opacity=Math.max(0,u.l)*.4}else s.material.opacity=0});
 flames.forEach(([f,l],i)=>{const q=1+Math.sin(tt*14+i*3)*.15+Math.random()*.08;f.scale.set(q,1.7*q,q);l.intensity=.8+Math.sin(tt*11+i)*.15});
 pl.forEach((l,i)=>l.intensity=1.15+Math.sin(tt*3+i)*.08);
 dust.position.y=Math.sin(tt*.7)*.12;dust.rotation.y=tt*.02;
 const r=ch.root;
 if(cm==='idle'){lk.set(0,1.4,15.5);cp.set(lk.x+Math.sin(.55+orb.a)*4.6,2.4+orb.p,lk.z+Math.cos(.55+orb.a)*4.6)}
 else if(cm==='follow'){lk.set(0,1.6,r.position.z-1.5);const dist=Math.max(5.5,Math.min(7.5,r.position.z+7.5));cp.set(lk.x+Math.sin(.38+orb.a)*dist,2.9+orb.p,lk.z+Math.cos(.38+orb.a)*dist)}
 else{lk.set(0,1.3,r.position.z);cp.set(lk.x+Math.sin(.9+orb.a)*5.5,2.8+orb.p,lk.z+Math.cos(.9+orb.a)*5.5)}
 cam.position.lerp(cp,1-Math.exp(-dt*2.5));lkc.lerp(lk,1-Math.exp(-dt*4));cam.lookAt(lkc);
 R.render(scene,cam)}
loop();
} catch(error) {
 console.error('Không thể khởi tạo cảnh 3D:',error);
 $('error').hidden=false;
}
