name: Update Stock Prices and Pages

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 07:00 Vietnam time, Tuesday through Saturday.
    - cron: '0 0 * * 2-6'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stock-prices-and-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read latest main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify stock price handling
        run: node --test apps/scripts/*.test.mjs

      - name: Verify Cron dispatcher and Pages packaging
        run: node --test infra/cloudflare-stock-cron/test/*.test.mjs .github/scripts/*.test.mjs

      - name: Get closing prices for the Admin cycle
        continue-on-error: true
        working-directory: apps
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          REFRESH_PREVIEW_CACHE: 'true'
        run: node scripts/update-stock-prices.mjs

      - name: Save only the price feed
        run: |
          if [ -n "$(git status --porcelain -- apps/market_prices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/market_prices.json
            git commit -m "Update daily stock closing prices"
            git push origin HEAD:main
          fi

      - name: Check source is still current before publishing
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Main changed during this run. The next run will use the latest Admin cycle."; exit 1; }

      - name: Stage public website files for GitHub Pages
        run: node .github/scripts/prepare-pages.mjs

      - name: Package the website for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Publish updated website and JSON
        id: deployment
        uses: actions/deploy-pages@v5
